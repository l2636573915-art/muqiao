<style>
  :root{--bg:#f3f4f6;--surface:#fff;--soft:#f9fafb;--soft2:#f3f4f6;--line:#e5e7eb;--line2:#d1d5db;

  .filter-title{font-size:11px;color:var(--muted);margin-right:2px;white-space:nowrap}.filter-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}

  .fbtn:hover{background:var(--soft)}.fbtn.active{background:var(--blue);border-color:var(--blue);color:#fff}

  .bar-sep{height:22px;width:1px;background:var(--line);margin:0 7px;flex-shrink:0}
  .find-wrap{flex:1;position:relative;min-width:180px;max-width:400px}.find{background:var(--soft);border:1px solid var(--line2);border-radius:6px;outline:none;width:100%;padding:7px 30px 7px 31px;font-size:12px;color:var(--dark)}
  .find:focus{background:#fff;border-color:var(--blue)}.find-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}

  .sidebar{width:var(--nav-w);flex:0 0 var(--nav-w);background:#fff;border-right:1px solid var(--line);position:sticky;top:calc(var(--header-h) + var(--filter-h));height:calc(100vh - var(--header-h) - var(--filter-h));overflow-y:auto;padding:13px 0 18px;scrollbar-width:thin}
  .side-heading{font-size:10px;letter-spacing:.11em;color:var(--faint);font-weight:750;padding:0 18px 10px}.side-link{border:0;background:transparent;display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:11px 16px;border-left:3px solid transparent;color:var(--text);transition:.12s}
  .side-link:hover{background:var(--soft)}.side-link.active{color:var(--blue);border-left-color:var(--blue);background:var(--blue-soft)}.side-link.no-match{opacity:.45}
  .side-icon{font-size:17px;width:23px;text-align:center;flex-shrink:0}.side-link>span:nth-child(2){display:block;min-width:0;flex:1}.side-name{display:block;font-size:12.7px;font-weight:680;white-space:normal;line-height:1.4}.side-desc{display:block;font-size:11px;color:var(--faint);margin-top:3px}.side-link.active .side-desc{color:#6ba0ef}

  .side-download:disabled{opacity:.45;cursor:not-allowed}.side-download:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .content{min-width:0;flex:1;padding:22px 26px 50px;max-width:calc(100vw - var(--nav-w));}

  .dept-heading{font-size:20px;font-weight:750;line-height:1.35;margin:0 0 5px}.dept-lead{font-size:12px;color:var(--muted);line-height:1.7;max-width:720px}.stats{display:flex;gap:25px;flex-shrink:0}.stat{text-align:center}.stat-num{font-size:27px;font-weight:750;color:var(--blue);line-height:1.1;font-variant-numeric:tabular-nums}.stat-label{font-size:11px;color:var(--muted);margin-top:5px}
  .section-tools{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin:-3px 1px 13px}.plain-btn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--muted)}.plain-btn:hover{border-color:var(--line2);color:var(--text)}
  .wf{margin-bottom:14px}.wf-head{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px 8px 0 0;padding:11px 15px;cursor:pointer;color:var(--text);width:100%;text-align:left}.wf-head:hover{background:var(--soft)}.wf-head.folded{border-radius:8px}
  .chev{width:13px;height:13px;color:var(--muted);transition:transform .18s}.wf-head.folded .chev{transform:rotate(-90deg)}.wf-name{font-size:13px;font-weight:750}.wf-count{margin-left:auto;border:1px solid var(--line);background:var(--soft2);border-radius:16px;padding:1px 9px;color:var(--muted);font-size:11px;white-space:nowrap}
  .wf-body{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}.wf-body.folded{display:none}
  .cols,.node-main{display:grid;grid-template-columns:minmax(205px,27%) minmax(330px,45%) minmax(205px,28%)}.cols{background:var(--soft2);border-bottom:1px solid var(--line);padding:7px 0;font-size:11px;font-weight:670;color:var(--muted)}.cols>div{padding:0 15px}
  .item{border-bottom:1px solid var(--line)}.item:last-child{border-bottom:none}.node-main{cursor:default;transition:background .12s}.node-main:hover{background:#fafbfd}
  .c-name,.c-process,.c-value{padding:13px 15px}.c-process,.c-value{border-left:1px solid var(--line);color:var(--text);font-size:12px;line-height:1.72;overflow-wrap:anywhere}
  .name-line{display:flex;align-items:flex-start;gap:8px}.scene-name{font-weight:700;font-size:13px;line-height:1.5;min-width:0}
  .description{color:var(--muted);font-size:11.3px;line-height:1.6;margin:6px 0 8px;display:block;overflow:visible}
  .tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tag{border:1px solid;border-radius:4px;line-height:1.6;padding:1px 7px;font-weight:680;font-size:10px}.t-rpa{background:var(--rpa-bg);color:var(--rpa-text);border-color:var(--rpa-line)}.t-ai{background:var(--ai-bg);color:var(--ai-text);border-color:var(--ai-line)}.t-combo{background:var(--combo-bg);color:var(--combo-text);border-color:var(--combo-line)}.geo-tag{color:#92400e;background:#fffbeb;border-color:#fde68a}.saved{color:#047857;background:#ecfdf5;border-color:#a7f3d0}
  .step-text{line-height:1.82}.c-value{color:var(--text)}.value-text{font-size:12px;line-height:1.85}.inline-pick{display:flex;justify-content:flex-start;margin-top:13px}.inline-pick .select-btn{font-size:10.5px;padding:6px 10px}.geo-inline{margin-top:12px;border-top:1px dashed #cbd5e1;padding-top:10px;font-size:10.7px;line-height:1.8;color:#64748b}.geo-inline b{color:#334155;font-weight:700}.geo-inline>div+div{margin-top:4px}
  .opportunity-text{font-size:12px;line-height:1.85;color:var(--text);white-space:normal;overflow-wrap:anywhere}
  .select-btn{border:1px solid #93c5fd;color:#1d4ed8;background:#fff;border-radius:6px;padding:7px 12px;font-size:11px;font-weight:650}.select-btn:hover{background:#eff6ff}.select-btn.in{border-color:#6ee7b7;background:#ecfdf5;color:#047857}.minor-note{color:var(--faint);font-size:11px}

  .empty{padding:50px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px}.empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}
  .bottom-note{padding:12px 1px 0;color:var(--faint);font-size:11px;line-height:1.7}.footer{background:#fff;border-top:1px solid var(--line);padding:14px 25px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-left:var(--nav-w)}
  mark{background:#fef08a;border-bottom:2px solid #facc15;border-radius:2px;padding:0 1px;color:#111827}
  @media(max-width:1100px){.cols,.node-main{grid-template-columns:minmax(165px,28%) minmax(280px,43%) minmax(165px,29%)}.h-pills .tiny-pill:not(.special-pill){display:none}.content{padding:18px}.hdr-desc{display:none}}
  @media(max-width:800px){:root{--header-h:54px;--filter-h:102px}.hdr{padding:0 14px}.bar{padding:8px 13px;flex-wrap:wrap;gap:7px;align-content:center}.find-wrap{order:3;max-width:none;flex:1 1 65%}.found{order:4}.bar-sep{display:none}.sidebar{width:100%;height:auto;overflow-x:auto;overflow-y:hidden;position:sticky;top:calc(var(--header-h) + var(--filter-h));z-index:35;padding:5px 8px;display:flex;gap:4px;border-right:0;border-bottom:1px solid var(--line);flex-basis:auto}.side-heading,.sidebar-foot,.side-desc{display:none}.side-link{width:auto;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;padding:7px 10px}.side-link.active{border-bottom-color:var(--blue)}.side-icon{font-size:15px;width:auto}.side-name{font-size:11px}.layout{display:block}.content{max-width:none;padding:14px}.footer{margin-left:0}.dept-hero{padding:16px;align-items:flex-start}.stat-num{font-size:22px}.stats{gap:13px}}
  @media(max-width:600px){.h-pills{display:none}.hdr{gap:7px}.brand{font-size:13px}.found{font-size:11px}.dept-hero{display:block}.stats{margin-top:12px;justify-content:flex-start}.stat{text-align:left}.cols{display:none}.node-main{grid-template-columns:1fr}.c-name{padding:13px 14px 6px}.c-process,.c-value{border:0;padding:6px 14px}.c-process::before,.c-value::before{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px}.c-process::before{content:'自动化机会点（详细描述）'}.c-value::before{content:'效能变化'}.inline-pick{margin-top:10px}.scene-name{font-size:13px}}
  @media print{.hdr,.bar,.sidebar,.section-tools,.bottom-note{display:none!important}.layout,.content{display:block;max-width:none;padding:0}.dept-hero{break-inside:avoid}.wf-body,.wf-head{break-inside:avoid}.item{break-inside:avoid}.footer{margin:0}body{background:#fff}.wf-body{display:block!important}}
</style>

<body>
<header class="hdr"><div class="brand"><span class="brand-dot"></span>独立站自动化机会地图</div><span class="hdr-desc">7 大业务链路 · 26 个场景组 · 74 个自动化机会点</span><div class="hdr-spacer"></div></header>
<section class="bar" aria-label="筛选及搜索"><span class="filter-title">能力类型</span><div class="filter-actions" id="techFilters"><button class="fbtn active" data-tech="all">全部</button><button class="fbtn" data-tech="rpa">流程自动化</button><button class="fbtn" data-tech="ai">AI</button><button class="fbtn" data-tech="combo">RPA + AI</button></div><span class="bar-sep"></span><div class="find-wrap"><svg class="find-icon" width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.5" stroke="currentColor" stroke-width="1.7"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="search" class="find" placeholder="搜索场景名称、应用描述、流程或业务价值…" aria-label="搜索场景" autocomplete="off"><button id="clearSearch" class="clear-find" title="清除搜索">×</button></div><span class="found">当前显示 <strong id="visibleCount">74</strong> 个机会点</span></section>

<script id="sourceData" type="application/json">{"domains":[{"id":"01","name":"商品运营与内容发布","icon":"🛍️","description":"商品资料采集→资料/素材核对→商品发布→持续在售维护","count":11,"groups":4},{"id":"02","name":"营销推广与竞品研究","icon":"📣","description":"广告投放 / 竞品研究 / 营销触达 / 品牌GEO（并行模块；GEO含监测→知识优化→复测闭环）","count":18,"groups":4},{"id":"03","name":"达人营销运营","icon":"🤝","description":"达人筛选→站内或邮件触达→合作跟进→效果归因","count":6,"groups":2},{"id":"04","name":"订单履约","icon":"📦","description":"订单采集→清洗/风控→发货任务→履约状态与物流异常跟踪","count":10,"groups":3},{"id":"05","name":"财务售后","icon":"💬","description":"退款申请→物流/支付核验→争议资料→审核处理→客服复盘","count":8,"groups":3},{"id":"06","name":"数据与经营","icon":"📊","description":"站点/广告/支付数据→口径统一→对账补数→周期经营报表","count":12,"groups":6},{"id":"07","name":"库存供应链","icon":"🚚","description":"仓库及SKU库存→库存同步与核对→补货测算→备货登记与仓配协同","count":9,"groups":4}],"items":[{"id":"01-01","domain":"商品运营与内容发布","group":"商品资料与素材准备","name":"商品资料批量采集","description":"按指定商品链接或供应商资料批量提取标题、参数、价格、描述及详情页链接，整理为统一商品资料表。","workflow":"根据运营人员提供的商品链接或供应商商品表，批量获取商品标题、规格参数、售价、描述及详情页地址。按SKU统一字段格式、清理重复记录，识别缺少参数或价格的商品，最终生成可用于上架的标准商品资料表和待补充清单。","impact":"由逐条复制转为批量整理，减少上新准备时间和字段遗漏。","tech":"rpa"},{"id":"01-02","domain":"商品运营与内容发布","group":"商品资料与素材准备","name":"商品图片采集与素材归档","description":"批量下载商品展示图、相册图片和素材，按SKU命名、分类并保存。","workflow":"根据SKU清单及指定素材来源，自动访问商品详情页或素材相册，批量下载商品主图和详情图片。按SKU、图片类型进行规范命名与分类归档，校验图片文件是否完整，并汇总失效链接和下载失败记录。针对销量图片、商品相册、第三方素材库等不同来源，分别记录来源链接和抓取日期；识别同SKU重复图片、尺寸不合规和文件损坏，统一归档供上架人员复核。","impact":"减少素材重复查找与下载，提升商品资料准备效率。","tech":"rpa"},{"id":"01-03","domain":"商品运营与内容发布","group":"商品资料与素材准备","name":"商品信息完整性与素材校验","description":"检查商品必填字段、图片可用性、素材路径和规格属性，生成缺失及异常清单供运营确认。","workflow":"读取待上架商品清单和图片素材目录，按照预先确认的商品发布标准检查标题、价格、必填参数、变体规格及图片链接。自动识别字段缺失、规格冲突、素材丢失等问题，输出逐SKU的修正清单，待运营确认后再进入发布流程。","impact":"发布前集中发现遗漏，减少重复返工和错误上架。","tech":"combo"},{"id":"01-04","domain":"商品运营与内容发布","group":"商品刊登与在售维护","name":"Shopify新品批量上架","description":"从ERP商品资料表或标准化Excel读取商品，按映射规则创建Shopify商品并记录发布结果。","workflow":"从ERP或Excel获取待上架商品资料，检查SKU、分类、售价、图片及必填属性是否符合Shopify发布要求。自动将字段映射到对应商品类别，批量上传素材并创建商品；发布后回查商品链接及状态，记录成功、重复和失败项目供运营复核。对于来自供应商平台、ERP或第三方刊登工具的资料，先按来源执行字段映射和SKU去重，再处理产品、变体、图片与类目关系；发布后核查详情页链接、在售状态及失败原因。","impact":"减少后台逐项录入，提升批量上新速度和一致性。","tech":"rpa"},{"id":"01-05","domain":"商品运营与内容发布","group":"商品刊登与在售维护","name":"多区域站点新品与内容同步","description":"依据不同市场的语言、价格、商品可售范围，将新品内容同步至对应站点并核验发布结果。","workflow":"从统一商品主数据表获取已审核新品信息，先判断企业采用Shopify Markets统一管理还是多个独立店铺，避免重复发布。对需要单独维护的地区，按语言、币种、定价及可售规则更新商品内容，核对各区域发布状态和链接，输出遗漏及差异报告。按站点建立语言、币种、商品范围及发布时间的映射清单；同步新品及更新内容时先比对目标站点现有记录，识别跨站点缺失、重复发布和差异项目，再执行更新并回查。","impact":"减少不同区域重复发布和校对商品资料，降低区域价格、语言与可售设置不一致。","tech":"rpa"},{"id":"01-06","domain":"商品运营与内容发布","group":"商品刊登与在售维护","name":"商品变体与选项批量维护","description":"批量更新商品规格、选项组合、SKU映射及产品关联配置，输出失败清单。","workflow":"根据运营提供的SKU与产品选项配置表，自动定位Shopify对应商品，批量新增或调整颜色、尺寸、型号等变体以及SKU映射关系。发布前核查规格组合是否重复、缺失或冲突，执行后回读配置结果并生成失败项清单。","impact":"减少复杂变体手工维护，降低规格和SKU匹配错误。","tech":"rpa"},{"id":"01-07","domain":"商品运营与内容发布","group":"商品刊登与在售维护","name":"商品图片路径批量修复","description":"批量识别商品素材旧链接，对照新路径更新图片引用并复核展示结果。","workflow":"批量读取独立站商品图片的原有链接及目标存储路径，根据商品SKU与素材文件的对应关系识别需要替换的图片引用。自动更新合规的图片路径，逐项检查页面能否正常加载图片，并输出无法匹配或修复失败的商品列表。","impact":"减少逐商品修复工作，降低页面图片失效风险。","tech":"rpa"},{"id":"01-08","domain":"商品运营与内容发布","group":"商品刊登与在售维护","name":"自有商品价格与上下架状态巡检","description":"定期检查本站商品售价、库存与发布状态，按照经批准的经营规则识别定价异常、缺货未下架和停售商品未关闭等问题。","workflow":"按设定周期采集独立站商品售价、折扣、库存和发布状态，与已批准的价格清单及上下架规则进行比对。自动标记异常价格、错误折扣、缺货仍在售等情况；经运营确认后执行允许范围内的修改，同时保存变更前后信息和处理日志。价格巡检同时核查站点售价、促销价和商品上架状态，区分正常调价与异常波动；仅对符合已确认阈值的异常生成复核清单，不直接覆盖人工定价决策。","impact":"从人工抽查商品页面转为按规则监控本站售价与状态，减少错误价格和下架遗漏。","tech":"rpa"},{"id":"01-09","domain":"商品运营与内容发布","group":"内容创作与发布","name":"Blog内容草稿及定时发布","description":"汇总文章主题与素材，生成待审稿件；经运营审核后发布至独立站博客并登记链接。","workflow":"根据内容团队提供的博客主题、产品素材和关键词，自动整理参考资料并形成符合品牌风格的文章草稿。将草稿提交负责人审核，审核通过后按计划发布至独立站博客，回填文章标题、URL和发布时间，便于后续内容管理。","impact":"减少排版和重复发布操作，提高内容更新频率。","tech":"ai"},{"id":"02-01","domain":"营销推广与竞品研究","group":"广告投放数据管理","name":"Meta广告账户数据自动汇总","description":"按账号、日期及广告层级下载Meta广告投放、消耗和效果数据，汇总至统一表。","workflow":"按照已授权的Meta广告账户和报表周期，定时提取广告系列、广告组的花费、曝光、点击及转化表现。统一账户时区和币种，识别缺失账户或指标异常，生成可按品牌、地区和日期查看的投放明细及汇总表。","impact":"减少多广告账户反复下载，提高日报及时性。","tech":"rpa"},{"id":"02-02","domain":"营销推广与竞品研究","group":"广告投放数据管理","name":"Google Ads投放数据自动汇总","description":"按账号和日期提取Google Ads投放数据，清洗字段后归并至统一经营报告。","workflow":"按指定日期和授权账户自动获取Google Ads广告系列、关键词、费用、点击与转化数据。对不同账户的时区、币种和统计口径进行统一，检查未取到数据的账户及明显异常值，整理为标准日报或周期投放报表。","impact":"降低跨账户人工整理工作量，便于对比投放表现。","tech":"rpa"},{"id":"02-03","domain":"营销推广与竞品研究","group":"竞争情报与市场监控","name":"竞品广告素材与投放动态监控","description":"按照竞品品牌词及市场，从公开广告资料库收集素材、文案、链接与更新情况，生成新增变化表。","workflow":"根据预设的竞品品牌、国家和产品关键词，定期查询允许访问的公开广告资料库，采集新出现的广告标题、素材链接、投放地区及落地页。对比上期记录，筛选新素材或重要变化，生成竞品广告动态清单供市场人员参考。","impact":"减少人工逐站搜索，及时掌握竞品推广变化。","tech":"rpa"},{"id":"02-04","domain":"营销推广与竞品研究","group":"竞争情报与市场监控","name":"竞品售价及促销动态监测","description":"定时查看指定竞品网站的公开商品售价、优惠券及折扣变化，供市场团队比较竞争价格策略（不修改本站价格）。","workflow":"根据竞品商品URL与SKU对照表，定时采集公开售价、优惠券及促销折扣信息，保存采集时间与价格快照。自动与上一次记录或设定阈值进行比对，标记明显降价、涨价和活动变化，并汇总需要运营关注的竞品列表。","impact":"由偶尔抽查转为持续监控，提升价格策略响应速度。","tech":"rpa"},{"id":"02-05","domain":"营销推广与竞品研究","group":"竞争情报与市场监控","name":"竞品新品上架监控","description":"定期检查竞品站点的商品列表，按发布时间或差异识别新商品并推送清单。","workflow":"定期巡检指定竞品官网的商品分类页或新品栏目，对比历史商品链接与最新展示清单，识别新出现的产品。自动提取产品名称、图片、公开价格及详情链接，整理为按品牌和日期分类的竞品上新报告。","impact":"提高新品发现及时性，减少人工浏览筛选。","tech":"rpa"},{"id":"02-06","domain":"营销推广与竞品研究","group":"竞争情报与市场监控","name":"竞品评价采集与用户需求分析","description":"合规采集竞品新增公开评论，去重后归纳抱怨点、功能诉求，关联原评论供人工复核。","workflow":"在符合网站访问规则的前提下，批量采集竞品商品的公开评价、评分、发表时间和原始链接。对评论内容进行清洗与主题分类，归纳产品故障、使用体验、功能诉求等高频问题，输出带原文依据的需求分析表供产品团队复核。在评价分析之外，补充从可合规访问的竞品详情页与市场选品资料中提取产品卖点、规格和常见痛点，并按品类与关键词形成差异化机会清单，交由选品人员确认。","impact":"将分散的评论整理为可追溯的产品洞察，减少人工阅读时间。","tech":"combo"},{"id":"02-07","domain":"营销推广与竞品研究","group":"竞争情报与市场监控","name":"竞品流量和关键词趋势跟踪","description":"从已获授权的数据工具获取竞品站点流量来源与关键词估计，按周期生成变化报告。","workflow":"按竞品域名清单从获授权的数据分析工具获取估算访问量、流量来源、热门关键词等指标。统一周期及比较口径，对比各品牌的变化趋势，自动形成竞品流量观察报表，并标明数据属于第三方估算值。","impact":"减少跨站点数据抄录，辅助评估渠道变化。","tech":"rpa"},{"id":"02-08","domain":"营销推广与竞品研究","group":"竞争情报与市场监控","name":"SEO搜索结果与页面监测","description":"按目标关键词及目标市场定期记录自然搜索排名、竞品页面和自身站点覆盖情况。","workflow":"根据市场、语言和重点关键词，定期查询合规的搜索结果数据，分别记录自有网站与竞品网站的自然排名及对应页面URL。对比历史排名，发现排名波动、目标页面缺失或失效情况，形成SEO监测清单供运营分析。","impact":"减少重复搜索工作，更快发现自然流量竞争变化。","tech":"rpa"},{"id":"02-09","domain":"营销推广与竞品研究","group":"营销触达与促销治理","name":"弃购客户邮件触达","description":"依据营销同意状态、弃购时间和客户分群，调用邮件平台发送合规提醒并回写结果。","workflow":"从独立站或邮件营销系统读取符合营销触达条件的弃购用户及商品信息，先检查订阅授权、退订状态、购买完成情况和触达频率。按弃购时间或用户标签匹配邮件模板，通过合规渠道发送提醒，并记录发送、退信和后续转化结果。","impact":"减少人工筛选与逐一触达，改善运营响应及时性。","tech":"rpa"},{"id":"02-10","domain":"营销推广与竞品研究","group":"营销触达与促销治理","name":"促销优惠码与活动清理","description":"识别过期活动、失效折扣及符合规则的待清理配置，先导出复核清单，确认后删除或停用。","workflow":"定期读取Shopify营销活动、优惠码及折扣规则，筛选已到期、重复配置或被运营标记为待清理的活动。核查活动适用商品、使用情况及潜在影响，对重要变更提交人工确认；自动停用符合规则的项目，回填处理明细和日志。","impact":"减少历史配置堆积与人工清理失误。","tech":"rpa"},{"id":"02-11","domain":"营销推广与竞品研究","group":"品牌GEO与AI搜索可见度","name":"品牌GEO目标问题词库建设","description":"围绕消费者在AI搜索中可能提出的品类、产品选购、使用问题及竞品对比，建立覆盖国家、语言和购买阶段的标准提问库。","workflow":"整合官网站内搜索、客服常见问题、产品说明和允许使用的公开问答，收集与品牌及产品相关的真实用户提问。按照国家、语言、产品线和购买意图分类去重，经业务人员确认后形成可持续更新的GEO监测问题词库。","impact":"从临时凭经验测试AI回答转为统一问题库，减少重复整理，使不同区域的监测更有可比性。","tech":"combo","geo":{"output":"GEO目标问题词库（问题、意图、市场、语言、产品线、版本）","metrics":"问题词覆盖数、问题库更新频率、重复率、市场与语言覆盖率","boundary":"不得把臆测的搜索量或模拟问题当作真实用户提问；问题库需按市场、语言维护"}},{"id":"02-12","domain":"营销推广与竞品研究","group":"品牌GEO与AI搜索可见度","name":"AI搜索品牌提及与回答准确性监测","description":"对固定问题集定期检查AI回答是否提及品牌或产品，以及功能、参数和适用边界描述是否准确，并保存可核验结果。","workflow":"读取已审核的GEO问题词库和市场配置，通过获授权且符合平台规则的方式定期获取指定AI搜索服务的回答。记录服务名称、提问时间、回答内容及引用链接，分析品牌是否出现、产品参数是否准确，并生成遗漏提及和错误信息的复核清单。","impact":"由人工随机询问转为同口径的周期监测，更早发现品牌信息缺席、过时或错误回答。","tech":"combo","geo":{"output":"AI回答监测明细（问题、地区、平台、时间、回答、引用、判定）","metrics":"品牌提及率、产品事实准确率、有引用回答占比、漏检/误判率","boundary":"AI回答不稳定；不得绕过反爬/访问限制，不能将回答位置视为固定排名"}},{"id":"02-13","domain":"营销推广与竞品研究","group":"品牌GEO与AI搜索可见度","name":"GEO引用来源与竞品差距分析","description":"分析AI回答引用的网页及品牌、竞品出现情况，识别缺失的产品事实、问答主题和可改进的信息来源。","workflow":"汇总已采集的AI回答及其公开引用来源，按照问题主题和目标市场提取本品牌、竞品及被引用的网站。核查来源时效性、可访问性与产品事实的一致性，识别竞品更常被引用的内容类型，输出品牌内容缺口与优化候选清单。","impact":"减少逐条分析AI回答和引用来源的工作，让内容团队更清楚应完善哪些品牌事实与问题答案。","tech":"combo","geo":{"output":"引用来源地图、竞品覆盖差距与内容机会清单","metrics":"有效引用URL数、信息缺口数、竞品对照问题覆盖率、可追溯结论占比","boundary":"只分析可合法访问的公开资料；AI引用来源并不等于品牌可以控制引用或曝光"}},{"id":"02-14","domain":"营销推广与竞品研究","group":"品牌GEO与AI搜索可见度","name":"品牌知识事实库与标准问答更新","description":"把品牌、型号、功能参数、适用场景、限制条件、售后政策等资料形成有来源、有版本的标准事实与FAQ。","workflow":"从已确认的官网产品页、规格文档、帮助中心和售后政策中提取品牌名称、型号、技术参数、兼容性及标准问答。自动识别来源版本过期和不同文档间的冲突，交由产品、品牌等责任人审核，形成统一且可追溯的多语言品牌事实资料库。","impact":"降低产品信息分散、版本冲突和重复核对成本，为官网内容一致性和AI回答事实校正提供依据。","tech":"ai","geo":{"output":"品牌事实主数据、FAQ问答库、版本变更记录","metrics":"事实条目完整率、版本冲突数、FAQ覆盖率、资料更新时间","boundary":"产品声明、性能参数、售后承诺须以官方有效版本为准，禁止AI自动编造事实"}},{"id":"02-15","domain":"营销推广与竞品研究","group":"品牌GEO与AI搜索可见度","name":"GEO内容优化与多语言发布校验","description":"围绕AI问答中的内容缺口，辅助制作并发布产品FAQ、使用指南、对比说明和品牌知识页面，检查公开可访问性与内容一致性。","workflow":"依据已确认的GEO优化建议与品牌事实库，辅助整理产品指南、FAQ及多语言内容草稿。由品牌和技术人员审核事实、版权及地区适用性后发布到Shopify或CMS，并自动检查页面访问、标题、内部链接、结构化数据及抓取设置，输出发布校验结果。","impact":"从零散内容修改转为由用户问题驱动的标准化内容维护，减少跨地区内容差错，提高品牌事实可获取性。","tech":"combo","geo":{"output":"GEO内容任务清单、已发布页面清单、页面质量核查报告","metrics":"内容任务完成率、事实审核通过率、多语言一致性问题数、页面可访问率","boundary":"禁止为AI排名批量生产低质/虚假内容；结构化数据应真实符合页面内容；不保证AI收录或引用"}},{"id":"02-16","domain":"营销推广与竞品研究","group":"品牌GEO与AI搜索可见度","name":"GEO周期复测与优化效果复盘","description":"在固定测试问题及采样口径下复测AI回答，追踪品牌提及、准确性及引用变化，生成可追溯的改进计划。","workflow":"使用固定版本的问题集、国家、语言和采样规则，周期性复测不同AI搜索服务中的品牌提及、事实准确性、引用来源及竞品出现情况。与历史基线比对并标记异常，结合官网内容更新记录生成复盘报告和下阶段优化任务，不将相关变化直接认定为优化带来的因果效果。","impact":"从一次性试验转为持续监控与闭环复盘，减少无依据的GEO效果判断。","tech":"combo","geo":{"output":"GEO月度效果报告、问题整改台账、下一轮迭代任务","metrics":"品牌提及率变化、准确率变化、引用来源变化、问题库覆盖率、整改完成率","boundary":"结果受模型/时间/地区影响；提及率和引用不是流量或销量的因果证明，不承诺推荐排名"}},{"id":"03-01","domain":"达人营销运营","group":"达人筛选与邀请","name":"达人名单筛选与联系资料整理","description":"根据行业、地区、账号内容和互动情况筛选候选达人，整理公开商务联系方式及联系状态。","workflow":"按照品牌目标行业、国家地区、粉丝规模和内容领域，从允许访问的渠道筛选潜在达人。批量整理账号名称、内容方向及公开商务联系方式，检查重复记录与品牌匹配度，并输出可交给营销人员确认的合作候选名单。","impact":"减少多平台人工筛选和整理，提高达人储备效率。","tech":"combo"},{"id":"03-02","domain":"达人营销运营","group":"达人筛选与邀请","name":"Instagram达人搜索与站内建联","description":"在Instagram寻找匹配品牌定位的达人，整理公开商务信息，并通过平台允许的站内方式开展初次合作触达。","workflow":"依据产品关键词、地区和达人内容类型筛选Instagram候选账号，整理账号画像、公开商务联系方式和历史联系状态。去除重复或失效对象，对符合平台规则且获准触达的对象发送合作邀请，并统一记录已发送、待回复和需人工跟进的名单。","impact":"减少重复搜寻与信息登记，提高建联跟进效率。","tech":"rpa"},{"id":"03-03","domain":"达人营销运营","group":"达人筛选与邀请","name":"达人合作邮件批量邀约与跟进","description":"针对已筛选且具有合法商务联系依据的达人，批量生成个性化合作邮件并回填发送和回复状态；不重复执行Instagram站内建联。","workflow":"从已审核的达人名单中读取商务邮箱、品牌合作模板及对应产品信息，按达人特点填充个性化合作内容。发送前检查联系依据、退订要求和发送频率，分批发出邮件，随后自动回写发送成功、退信和回复状态，生成跟进表。","impact":"降低重复邮件操作，便于统一管理触达进度。","tech":"rpa"},{"id":"03-04","domain":"达人营销运营","group":"达人筛选与邀请","name":"联盟营销站内邀请","description":"根据Refersion等联盟营销平台规则创建站内邀请并记录邀请结果。","workflow":"读取Refersion等联盟营销平台中的邀请活动配置及候选合作对象，校验对象资格和活动有效期，按平台规则生成或调用专属邀请链接。批量发送站内邀请并登记受邀结果，方便运营跟踪联盟成员加入情况。","impact":"减少重复邀请动作，提高联盟伙伴管理效率。","tech":"combo"},{"id":"03-05","domain":"达人营销运营","group":"达人合作跟进与归因","name":"达人合作状态汇总与催办","description":"整合达人回复、合作阶段与待办事项，提醒相关负责人跟进，关键合作事项由人工确认。","workflow":"定期汇总达人营销台账、合作邮件和经授权可获取的回复状态，区分已回复、未回复、等待寄样或待签约等阶段。根据负责人和跟进时限生成提醒任务，回填人工确认的下一步动作，避免合作线索遗漏。","impact":"减少漏跟进和重复沟通，让合作状态更可视。","tech":"combo"},{"id":"03-06","domain":"达人营销运营","group":"达人合作跟进与归因","name":"达人折扣码与订单归因匹配","description":"关联达人专属折扣码、合作信息与实际订单，生成转化及佣金核对清单。","workflow":"读取达人合作清单、专属折扣码及Shopify订单明细，根据优惠码、活动时间和约定归因规则匹配合作订单。核对销售额、退款和异常订单，形成达人合作效果报表以及无法归因的订单清单，支持营销人员复核。","impact":"减少人工核对，提升达人合作效果统计的可追溯性。","tech":"combo"},{"id":"04-01","domain":"订单履约","group":"订单接入、清洗与审核","name":"多站点订单批量采集","description":"按日期和店铺从Shopify等独立站导出新增订单，并统一字段格式汇总。","workflow":"按指定时间范围，通过各独立站授权接口或后台批量获取新增订单，提取订单号、商品SKU、收货信息、金额及订单状态。统一多站点字段和币种表示，按订单唯一标识去重，生成标准订单明细及漏取异常清单。","impact":"减少各站点重复登录下载，提高订单集中处理效率。","tech":"rpa"},{"id":"04-02","domain":"订单履约","group":"订单接入、清洗与审核","name":"订单信息标准化与自动分组","description":"按商品、目的国家、收货地址等字段对订单清洗、分类和分配，输出异常字段清单。","workflow":"获取多个独立站待处理订单，按照商品类别、收件国家、目的仓库或业务负责人等预设规则自动分类整理。校验SKU、地址和订单状态等必需信息，输出可用于仓库分拣、客服处理或财务核算的分类明细，并推送相关岗位。","impact":"减少手工分单与反复整理，降低分派错误。","tech":"rpa"},{"id":"04-03","domain":"订单履约","group":"订单接入、清洗与审核","name":"异常与风险订单自动筛查","description":"根据地址缺失、订单信息异常和预设风控规则筛查订单，高风险订单进入人工复核。","workflow":"定时获取待审核订单及可用的支付风控信号，依据地址缺失、金额差异、重复下单等经确认的规则进行风险筛查。自动汇总疑似异常的订单及证据，按风险等级提交人工复核，仅将审核通过的订单转入后续发货流程。","impact":"更早识别订单风险，减少漏审和不当自动放行。","tech":"rpa"},{"id":"04-04","domain":"订单履约","group":"订单接入、清洗与审核","name":"订单收货国家及地址信息校验","description":"比对订单国家、地区和地址字段，按确认的映射规则补全或标记异常。","workflow":"批量读取待发货订单中的国家、省市、邮编和详细地址，与物流商要求及地区编码规则进行校验。识别地址不完整、国家代码不一致等问题，对可确定的格式错误生成修正建议，需人工确认的订单单独列出，避免错误地址直接进入发货。将收货国家、地址字段和发货渠道要求分开核验，识别缺失国家代码、字段冲突和无法匹配的地址；异常订单进入人工确认池，避免错误发货。","impact":"减少地址错误引起的发货返工和人工修改。","tech":"rpa"},{"id":"04-05","domain":"订单履约","group":"发货执行与第三方履约","name":"单站订单批量生成发货任务","description":"针对某一独立站的已审核订单，按照既定仓库和物流规则批量生成发货指令、面单并回传状态；不含跨渠道统一订单路由。","workflow":"定期读取单个独立站已审核通过的待发货订单，匹配预设仓库和承运渠道，批量生成面单或OMS/WMS发货任务。提交后获取仓库受理结果，更新订单处理状态，汇总创建失败、信息缺失或重复提交的记录。","impact":"减少逐单操作，加快订单履约处理。","tech":"rpa"},{"id":"04-06","domain":"订单履约","group":"发货执行与第三方履约","name":"包装图片识别与订单匹配","description":"识别包装图片中的SKU及订单标识，匹配待发货订单，对不一致项交人工处理。","workflow":"收集仓库上传的包装照片或包裹标签，识别其中的SKU、数量、订单号等可见信息，并与待出库订单逐项匹配。对数量不一致或无法识别的图片生成复核任务，匹配正确且经确认后再触发对应发货操作。对照订单SKU、件数及包装图片中的可识别信息，先生成逐单核对结果；图片模糊、包装标识缺失或一图多单等情况单独列为异常，不直接放行。","impact":"减少图片查找和人工比对，提高发货匹配准确性。","tech":"combo"},{"id":"04-07","domain":"订单履约","group":"发货执行与第三方履约","name":"多渠道订单汇总与仓库路由","description":"将多个独立站及其他渠道订单统一采集、字段映射，并按区域及仓库规则分配履约任务；重点是跨渠道整合，不重复单站面单操作。","workflow":"统一采集Shopify及其他销售渠道的待履约订单，整理渠道单号、商品SKU、收货国家和库存要求。校验重复订单及跨平台主键关系后，按仓库覆盖范围和履约规则自动分配任务到OMS/WMS，记录仓库接收结果与分配差异。对于跨平台订单和多仓配送，增加订单来源、渠道限制、仓库可发货条件与回传目标的映射校验；不满足规则时进入待确认列表，保留人工改派入口。","impact":"减少跨平台重复操作，集中管理履约进度。","tech":"rpa"},{"id":"04-08","domain":"订单履约","group":"物流跟踪与异常处理","name":"物流跟踪号自动回填","description":"从OMS、物流商或仓库提取跟踪号，核验订单映射后批量写回Shopify。","workflow":"从OMS、WMS或物流商获取已出库订单、承运商及跟踪号码，根据订单号和履约批次匹配Shopify订单。检查跟踪号缺失、重复或与原记录冲突的情况，只回填校验通过的数据，同时输出失败订单及需人工处理的异常清单。","impact":"降低漏填、错填和重复输入，提高信息同步时效。","tech":"rpa"},{"id":"04-09","domain":"订单履约","group":"物流跟踪与异常处理","name":"物流异常识别与跟进","description":"定时跟踪包裹轨迹，识别长期未更新、异常状态或配送失败，生成待跟进清单。","workflow":"定时读取未签收订单及物流跟踪号，通过物流商接口或合规查询渠道获取最新运输轨迹。按停滞天数、派送失败、异常退回等规则识别风险包裹，自动创建客服跟进清单，通知负责人并记录后续处理状态。","impact":"由被动查询转为主动发现异常，减少漏跟进。","tech":"rpa"},{"id":"04-10","domain":"订单履约","group":"发货执行与第三方履约","name":"OBS及第三方履约状态同步","description":"通过可用接口或后台采集第三方系统订单状态，按订单号更新独立站履约信息。","workflow":"从OBS或第三方履约系统获取订单受理、发货和物流状态，按照订单编号及承运商跟踪号匹配独立站订单。对匹配成功的记录更新站点履约信息，保留状态冲突、无对应订单和接口失败的明细供核对。同步第三方仓配或OBS系统的订单节点时，维护状态映射表，按订单号和追踪号去重；对超时、状态倒退或接口缺失的数据记录异常并回查。","impact":"减少人工切换系统查询，提高订单状态一致性。","tech":"rpa"},{"id":"05-01","domain":"财务售后","group":"退款受理与执行核对","name":"退款申请自动登记与分类","description":"从独立站或客服系统获取退款申请，按原因、金额、物流状态分类并建立待处理台账。","workflow":"从客服系统和独立站批量获取退款申请，自动整理订单号、商品SKU、申请原因、退款金额与提交时间。依据经确认的售后规则按原因、金额或责任部门分类，输出待审核退款台账并通知对应负责人。","impact":"减少人工汇总，帮助客服与财务及时处理。","tech":"rpa"},{"id":"05-02","domain":"财务售后","group":"退款受理与执行核对","name":"退款订单物流签收核验","description":"根据申请退款订单的物流单号查询承运商或17TRACK轨迹，记录是否签收及最新状态。","workflow":"根据已登记的退款申请和物流单号，通过承运商或17TRACK等获授权渠道查询运输节点及签收记录。自动保存可追溯的查询结果，识别在途、已签收或轨迹异常情况，生成供售后人员判断退款条件的核验清单。","impact":"减少跨网站查询，提高退款审核证据完整度。","tech":"rpa"},{"id":"05-03","domain":"财务售后","group":"PayPal争议与申诉","name":"PayPal争议证据资料自动汇总","description":"按争议订单收集订单信息、发货面单、追踪记录及发票，生成待审核证据包。","workflow":"按PayPal争议案件编号定位真实订单，从授权系统提取付款流水、发票、发货面单、物流轨迹和签收凭证。根据争议类型整理证据目录并注明来源，标记材料缺失、订单不匹配或信息冲突，形成待人工核对的申诉资料包。","impact":"减少跨系统整理证据的时间，降低材料遗漏。","tech":"rpa"},{"id":"05-04","domain":"财务售后","group":"PayPal争议与申诉","name":"PayPal争议申诉资料提交","description":"对人工确认准确的争议资料按授权流程填写并提交，回写提交结果和状态。","workflow":"读取已由业务负责人审核通过的PayPal争议材料，检查争议类型、证据附件和提交截止时间，按获授权的操作流程录入申诉内容。提交前再次由人工确认关键内容，提交后自动记录案件编号、时间、状态及失败原因。","impact":"减少重复录入，提高申诉处理效率及留痕质量。","tech":"rpa"},{"id":"05-05","domain":"财务售后","group":"退款受理与执行核对","name":"重复退款与二次退款核查","description":"将退款申请、已完成退款及支付平台流水交叉核对，发现潜在重复或异常金额；资料中的“PayPal二次退款”仅是名称依据，实际业务需验证。","workflow":"读取新的退款申请及原交易信息，对照PayPal或其他支付系统中已完成和处理中退款流水，按交易ID、订单号、退款金额核对。自动识别重复申请、部分退款和金额异常，生成财务复核清单，不直接执行二次退款。","impact":"降低重复退款风险，减少人工跨系统核对。","tech":"rpa"},{"id":"05-06","domain":"财务售后","group":"退款受理与执行核对","name":"售后退款状态同步","description":"将审核、退款执行及支付结果同步至售后台账，异常或失败案件推送人工复核。","workflow":"从客服售后系统读取已审核退款单，查询支付平台的实际退款处理结果，按订单号和交易流水进行匹配。对退款成功的记录同步售后状态，对金额不符、处理中或回写失败的记录提示人工核对并保留处理日志。","impact":"减少客服、财务对账信息不同步。","tech":"rpa"},{"id":"05-07","domain":"财务售后","group":"客服任务与服务分析","name":"客服工单处理进度汇总","description":"从客服平台采集工单状态、负责人及待处理事项，生成跟进列表。","workflow":"定期获取客服平台的待分配、处理中和超时工单，整理工单编号、咨询类型、负责人及处理截止时间。按照既定分派和提醒规则生成跟进清单，对高优先级及超时任务自动通知相关人员，辅助主管查看处理进度。按客服工单来源、处理人、首次响应与当前进度汇总待办，对超时和长期未关闭事项输出跟进清单；实际自动回复与升级规则需依据客户现有系统确认。","impact":"提升工单可见度，减少漏办和反复核查。","tech":"rpa"},{"id":"05-08","domain":"财务售后","group":"客服任务与服务分析","name":"客服对话记录分析","description":"导出客服沟通记录，去重清洗后整理咨询热点、退款原因和服务问题，保留原始证据。","workflow":"从获授权的客服系统导出聊天记录，按订单及问题类型清洗去重，并对咨询主题、产品问题、退款原因等信息进行归类。自动形成每日咨询摘要和问题分布报告，保留必要的原记录引用供客服主管核查。除对话内容归类外，按咨询主题、典型问题、退款诉求和重复咨询整理结构化摘要，形成可复核的知识补充候选，并明确由客服主管审核。","impact":"减少人工复盘时间，辅助发现高频售后问题。","tech":"combo"},{"id":"06-01","domain":"数据与经营","group":"经营报表与投放归因","name":"Shopify多站点销售日报生成","description":"定时采集各站点订单量、销售额、退款等数据，按统一口径输出日报并校验缺失。","workflow":"按日从各Shopify店铺提取订单、销售额、退款及商品销售数据，统一时区、币种及净销售额统计口径。自动核对缺失日期和明显异常值，生成跨站点销售日报并按配置分发给运营人员，同时归档原始数据与报表版本。","impact":"减少每天重复下载及拼表，提高经营数据及时性。","tech":"rpa"},{"id":"06-02","domain":"数据与经营","group":"经营报表与投放归因","name":"Shopify订单周报与月报汇总","description":"按店铺、国家、渠道和日期自动导出订单报表并汇总归档。","workflow":"按周或月批量提取独立站订单和销售数据，根据渠道、国家、SKU和产品线汇总经营指标。与已有日表或财务口径进行校验，生成周期销售报告，并保存统计时间范围和数据来源以便后续追溯。","impact":"由逐站逐期手工报表转为定期自动生成。","tech":"rpa"},{"id":"06-03","domain":"数据与经营","group":"经营报表与投放归因","name":"GA4网站流量与转化数据采集","description":"通过授权接口提取流量来源、访问、转化等指标，生成趋势表并标注统计口径。","workflow":"通过获授权的GA4接口获取网站访问量、流量来源、重要事件及转化数据，统一站点和日期维度后计算同期变化。自动生成流量与转化趋势报表，识别异常波动或缺失指标，供运营人员分析。","impact":"降低数据取数成本，提高网站表现分析及时性。","tech":"rpa"},{"id":"06-04","domain":"数据与经营","group":"经营报表与投放归因","name":"广告投放与销售经营数据核对","description":"整合广告平台、Shopify订单和支付数据，对齐时间、币种、归因口径并标记不一致。","workflow":"整合Meta和Google Ads广告花费、Shopify销售订单及支付平台流水，统一日期、币种和可比较的数据口径。自动比对广告投放与经营结果中的关键指标，标注无法匹配的差异并输出复核报告，避免将不同归因口径的数据直接等同。GA4流量、广告投放与订单转化数据分别保留采集时间和统计口径，标识来源差异；对无法直接归因的变化只展示对比，不直接判定因果。","impact":"减少跨系统反复核数，让经营报告更一致。","tech":"rpa"},{"id":"06-05","domain":"数据与经营","group":"支付财务与单据对账","name":"Stripe及PayPal财务流水汇总","description":"拉取支付流水、退款、手续费等明细，按日期和币种分类汇总生成财务表。","workflow":"定期从Stripe和PayPal等支付渠道导出收款、退款及手续费明细，按照交易号进行去重和字段标准化。分币种、日期和支付方式生成财务流水汇总，标记缺失记录或异常交易供财务核对。","impact":"减少支付平台切换及人工汇总，提高结算核对效率。","tech":"rpa"},{"id":"06-06","domain":"数据与经营","group":"支付财务与单据对账","name":"领星/金蝶与独立站数据校对","description":"按订单号、金额及对应字段校验ERP与财务系统的独立站数据，输出差异清单。","workflow":"定期导出独立站订单与ERP、领星或金蝶中的相关单据，根据订单号、SKU、币种和金额建立对应关系。自动发现漏单、重复单、金额差异及状态不一致，生成可追溯的差异清单供业务和财务确认。独立站订单与财务系统单据核对时，明确订单号、交易流水、币种、手续费及退款状态的匹配逻辑；对跨周期和多笔合并款项单独列出差异待核查。","impact":"更快发现单据及财务数据不一致，减少漏账风险。","tech":"rpa"},{"id":"06-07","domain":"数据与经营","group":"数据补跑、备份与主数据治理","name":"历史数据补跑与缺失修复","description":"针对报表缺口按指定时间段重新拉取数据并校验数量、日期及重复记录。","workflow":"根据数据任务日志及报表缺口定位需要重跑的店铺、日期和数据类型，重新获取历史订单或交易明细。以订单号或交易主键去重，核对补跑前后条数和金额，再更新缺失数据并记录修复结果。","impact":"减少缺失数据的人工重做，提高报表完整性。","tech":"rpa"},{"id":"06-08","domain":"数据与经营","group":"数据补跑、备份与主数据治理","name":"独立站经营数据备份与归档","description":"按备份清单安全导出订单、交易及活动数据，校验备份结果并分类留存。","workflow":"根据企业确定的备份范围，定期导出独立站订单、商品、交易及营销活动历史数据，按照权限要求加密保存并按日期和站点归档。核验文件数量、字段与文件完整性，对导出失败或存储异常自动生成提醒和补跑记录。","impact":"降低历史数据丢失与迁站取数风险，改善数据可追溯性。","tech":"rpa"},{"id":"06-09","domain":"数据与经营","group":"数据补跑、备份与主数据治理","name":"多站点商品主数据映射与差异核对","description":"核对不同站点的商品编码、基础属性及商品主数据映射，输出需修正的差异项；不涉及01-05新品发布，也不直接执行07-01库存更新。","workflow":"采集各区域店铺已发布商品的SKU、商品ID、名称和规格属性，按照企业商品主数据字典建立对应关系。自动对比重复编码、缺失字段及不同站点描述不一致的情况，生成差异和修正建议；经运营核准后再更新主数据台账。","impact":"减少跨站点重复维护与字段不一致。","tech":"rpa"},{"id":"07-01","domain":"库存供应链","group":"库存同步、调整与核对","name":"Shopify与海外仓库存自动同步","description":"定期采集海外仓/WMS库存，按SKU及仓库映射更新Shopify可售库存并记录差异。","workflow":"定时获取海外仓或WMS提供的SKU库存、冻结量和可售数量，统一SKU及仓库编码，根据批准的库存分配规则计算各Shopify站点可售库存。自动更新对应库存并回读核验，将接口失败、负库存和数量冲突记录为异常。对站点与海外仓SKU编码、仓库位置及库存状态设置映射关系，区分可售、锁定和在途库存；核对差异并留下回传记录，防止直接覆盖导致错库。","impact":"减少库存反复录入，降低超卖和错误展示风险。","tech":"rpa"},{"id":"07-02","domain":"库存供应链","group":"库存同步、调整与核对","name":"多渠道库存差异核对","description":"比对Shopify、TikTok Shop、ERP与仓库库存，识别SKU、仓库和数量差异。","workflow":"批量提取Shopify、TikTok Shop、ERP及仓库系统的库存数据，统一商品SKU、仓库及库存状态口径。按商品与仓库对比实物、在途和可售数量，标记缺货、负库存或多渠道不一致，输出待核查的库存差异表。","impact":"减少人工跨平台核对，及时发现库存异常。","tech":"rpa"},{"id":"07-03","domain":"库存供应链","group":"库存同步、调整与核对","name":"独立站商品库存批量调整","description":"按经审核的库存调整表批量更新商品库存，回写执行结果和失败原因。","workflow":"读取仓库盘点完成并已审批的SKU库存调整表，核验商品、仓库及调整幅度是否符合业务规则。批量更新独立站对应库存，回查修改后的可售数量，记录执行失败和超出允许范围的调整项目。","impact":"减少后台逐SKU修改，提高盘点调整效率。","tech":"rpa"},{"id":"07-04","domain":"库存供应链","group":"补货测算与备货登记","name":"销售速度与补货建议生成","description":"结合近期开单速度、现有库存及采购提前期计算建议补货量，输出待审核补货表。","workflow":"按SKU汇总近期销售速度、现有库存、在途数量及采购提前期，结合已确定的安全库存规则计算建议补货量。自动生成补货建议表并标识潜在断货或库存积压风险，交由采购负责人审核后再执行后续采购。","impact":"减少人工公式整理，提前发现潜在缺货。","tech":"rpa"},{"id":"07-05","domain":"库存供应链","group":"补货测算与备货登记","name":"季节性备货需求分析","description":"综合历史销量、旺季影响、采购周期与安全库存形成SKU备货分析表。","workflow":"整合商品历史销量、季节性变化、促销计划、采购周期及安全库存等资料，按SKU测算不同时间窗口的预计备货量。自动生成备货分析报告，并注明数据缺失或销量波动异常的商品供采购人员判断。","impact":"提高备货测算效率，为采购计划提供统一依据。","tech":"rpa"},{"id":"07-06","domain":"库存供应链","group":"补货测算与备货登记","name":"海外仓备货计划与登记更新","description":"根据批准的备货计划更新海外仓备货台账、货物数量及状态，并同步相关部门。","workflow":"根据已审批的海外仓备货计划，按SKU和目的仓库更新备货台账、计划数量、预约及出运状态。定期读取物流或仓库反馈，对逾期未更新、数量差异等情况提醒责任人，并向运营和供应链同步进度。","impact":"减少多方手工登记和重复通知，提高计划可追踪性。","tech":"rpa"},{"id":"07-07","domain":"库存供应链","group":"海外仓发货分配协同","name":"海外仓订单分配与发货协同","description":"按物流区域、商品库存与仓库规则分配发货仓，提交发货任务并记录仓库反馈。","workflow":"从独立站读取待发货订单及收货地区，结合海外仓可用库存、承运渠道和物流时效规则生成发货仓分配建议。由负责人确认关键分配后，批量向仓库提交发货指令，回填订单受理与物流跟踪信息。海外仓发货协同时补充订单分仓依据、仓库可履约条件及异常改派流程；跟踪发货任务、物流单号回传和未成功交接事项。","impact":"减少仓库选配与单据传递工作，提高履约协同效率。","tech":"rpa"},{"id":"07-08","domain":"库存供应链","group":"库存同步、调整与核对","name":"仓库发货结果与站点库存核对","description":"在仓库发货完成后核查出库数量、站点订单状态和库存扣减是否一致，侧重结果对账，不重复库存自动同步。","workflow":"定期获取仓库真实出库记录、物流跟踪号和Shopify订单履约状态，按订单及SKU核对实发数量、站点库存扣减和订单更新是否一致。发现漏回传、数量差异或状态冲突时自动建立差异清单，交责任人核对并记录修正结果。","impact":"更快发现发货与库存信息不一致，减少后续人工补录。","tech":"rpa"},{"id":"01-N01","domain":"商品运营与内容发布","group":"商品刊登与在售维护","name":"网站健康巡检与交易链路异常预警","description":"定期检测关键页面、商品购买路径和结账入口是否正常，及时发现影响销售的问题。","workflow":"按国家站点、设备类型和关键页面清单定时检查首页、商品页、购物车及结账入口是否可访问，核查关键按钮、跳转链接、价格展示和商品状态。采集状态码、加载异常与页面变更；对支付测试仅使用获授权的测试环境或沙盒交易，不触发真实扣费。按影响范围和持续时间分级推送异常，生成修复工单并在修复后自动复测。","impact":"减少人工逐站巡查，让网站和购买链路故障更早被发现、分级处理并验证修复效果。","tech":"combo"},{"id":"06-N02","domain":"数据与经营","group":"流量转化与经营分析","name":"独立站转化漏斗异常诊断","description":"将访问、商品浏览、加购、发起结账到支付完成的数据串成漏斗，定位转化流失环节。","workflow":"按站点、国家、设备、流量来源及时间周期汇总经口径校验的访问、浏览商品、加购、发起结账和购买事件。识别关键环节转化率异常波动，并结合页面可用性、库存、价格和渠道变化生成待核查原因清单；对缺少埋点或跨端追踪缺失的数据标记为不可直接比较。生成责任人待办和改进后复测报告。","impact":"从单纯采集报表升级为发现转化瓶颈、定位可能原因和跟踪优化闭环。","tech":"combo"},{"id":"06-N03","domain":"数据与经营","group":"客户生命周期运营","name":"客户分层与生命周期运营","description":"综合购买次数、消费金额、最近消费时间及客户同意状态形成运营分层。","workflow":"汇总独立站已授权客户的历史订单、净消费金额、最近购买日期与退款记录，按业务确认的RFM或生命周期规则划分新客、活跃客、潜力客、高价值客及流失风险客。识别无效或重复客户ID，输出不同群体的购买偏好与经营建议；分群结果经运营确认后同步到允许使用的CRM或营销系统。","impact":"减少手工分群与跨系统数据处理，使客户运营更有针对性且能周期复盘群体变化。","tech":"combo"},{"id":"02-N04","domain":"营销推广与竞品研究","group":"营销触达与促销治理","name":"沉睡客户识别与复购唤醒","description":"识别长时间未购买但符合合规触达条件的老客，并开展分层唤醒。","workflow":"按最近购买时间、历史订单、商品类型及退款售后状态识别沉睡客户；检查营销授权、退订状态、频控、地区政策与已有触达记录，排除不宜重复触达的客户。针对不同客户分层匹配审核后的邮件或其他营销模板，调用合规营销渠道发起触达，记录发送、点击、后续复购与退订情况，定期优化触达规则。","impact":"将老客唤醒从人工筛选升级为合规的分层触达和效果复盘，提高客户复购运营效率。","tech":"combo"},{"id":"02-N05","domain":"营销推广与竞品研究","group":"营销触达与促销治理","name":"营销活动效果与投入产出复盘","description":"围绕促销活动统一核算销售增量、折扣成本、流量和订单表现，形成可对比的复盘。","workflow":"从活动配置、订单、优惠码、广告投放和站点分析中读取活动起止时间、参与商品、优惠金额、销售额、退款及相关渠道费用。按统一口径计算活动期间的转化、客单价、净销售额和可识别投入，与基线或可比时段对照；标记季节性、自然流量波动和不可归因数据，不将相关性直接解释为活动因果效果。输出活动复盘报告与下一轮调整清单。","impact":"减少多平台手工汇表，帮助运营看清活动效果、成本和待改进环节。","tech":"combo"},{"id":"06-N06","domain":"数据与经营","group":"财务核算与盈利分析","name":"SKU级经营利润自动核算","description":"整合销量、商品成本、广告、物流、支付费用和售后损失，形成SKU层面的利润测算。","workflow":"将SKU订单明细与采购成本、头程尾程物流、支付手续费、广告归集、折扣、税费、退款和汇率数据按确认的规则关联，处理跨币种、跨周期、费用分摊和一单多SKU。按市场与时间核算收入、费用、毛利及可解释的经营贡献利润；对缺失或暂无法合理分摊的费用单列，输出数据质量和利润异常清单供财务复核。","impact":"让利润分析从总销售额和人工拼表下沉到SKU级，提升定价、促销和补货决策依据。","tech":"combo"},{"id":"07-N07","domain":"库存供应链","group":"库存分析与备货策略","name":"滞销库存识别与清仓策略分析","description":"对销量、库龄、资金占用和可售库存进行综合分析，提前识别滞销风险。","workflow":"按SKU、仓库和市场汇总库存快照、入库日期、近30/60/90天销量、退货与在途数据，计算周转天数、库龄结构及可能的滞销积压。结合补货周期、季节性和活动计划识别高风险SKU，形成降价、渠道调拨、组合促销或暂停补货的候选建议，涉及价格与库存处置由负责人审批后执行，并跟踪清理结果。","impact":"减少人工逐SKU排查，提升库存风险响应速度，降低库存资金占用及长期积压。","tech":"combo"},{"id":"01-N08","domain":"商品运营与内容发布","group":"商品价格与收益管理","name":"商品价格及毛利保护预警","description":"监测成本、汇率、售价与促销叠加引起的毛利变化，在执行前识别低毛利风险。","workflow":"同步商品售价、促销规则、采购及履约成本、支付手续费、税费和适用汇率，根据市场与SKU计算测算毛利率，检测低于业务阈值、负毛利或折扣叠加异常。形成价格风险预警和建议调整区间，重要价格变更提交运营或财务审批；回查最终上架价格及处理结果。","impact":"减少因成本波动或促销配置造成的低毛利销售，降低人工反复测算与漏检成本。","tech":"combo"}]}</script>
<script>
(()=>{
'use strict';
const db=JSON.parse(document.querySelector('#sourceData').textContent);
const items=db.items, domains=db.domains;
const state={domain:(location.hash.match(/#(0[1-7])/i)||[])[1]||'01',tech:'all',q:'',selected:new Set(),closed:new Set()};
const $=sel=>document.querySelector(sel);
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=x=>String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function highlight(x){const s=escapeHtml(x);const q=state.q.trim();if(!q)return s;return s.replace(new RegExp('('+escRe(escapeHtml(q))+')','gi'),'<mark>$1</mark>')}
const label={rpa:'流程自动化',ai:'AI',combo:'RPA + AI'};
const countGroup=(arr)=>new Set(arr.map(x=>x.group)).size;
const isMatch=x=>(state.tech==='all'||state.tech===x.tech)&&(!state.q||[x.id,x.domain,x.group,x.name,x.description,x.workflow,x.impact].join(' ').toLocaleLowerCase().includes(state.q.toLocaleLowerCase()));
const matched=()=>items.filter(isMatch);
const activeName=()=>domains.find(d=>d.id===state.domain)?.name||domains[0].name;
const byDomain=domain=>matched().filter(x=>x.domain===domain);
function navHtml(){return `<div class="side-heading">业务链路导航</div>`+domains.map(d=>{const n=byDomain(d.name).length;return `<button type="button" class="side-link ${state.domain===d.id?'active':''} ${!n?'no-match':''}" data-id="${d.id}" title="${escapeHtml(d.name)}"><span class="side-icon">${d.icon}</span><span><span class="side-name">${escapeHtml(d.name)}</span><span class="side-desc">${n} 个机会点 · ${d.groups} 个场景组</span></span></button>`}).join('')+`<div class="sidebar-foot"><b>客户需求选择</b><div>已标记 <strong id="selectedNum">${state.selected.size}</strong> 个感兴趣场景，可下载为CSV供后续沟通。</div><button id="exportSelected" class="side-download" ${state.selected.size?'':'disabled'}>导出已选场景（CSV）</button><button id="resetSelected" class="side-download" ${state.selected.size?'':'disabled'}>清空已选</button></div>`}
function tagHtml(x){return `<span class="tag t-${x.tech}">${label[x.tech]}</span>`+(x.geo?`<span class="tag geo-tag">GEO 专题</span>`:'')+(state.selected.has(x.id)?'<span class="tag saved">已选入清单</span>':'')}
function stepsHtml(s){return `<div class="opportunity-text">${highlight(s)}</div>`}
function rowHtml(x){const extra=x.geo?`<div class="geo-inline"><div><b>专项产出：</b>${highlight(x.geo.output)}</div><div><b>验证指标：</b>${highlight(x.geo.metrics)}</div><div><b>实施提醒：</b>${highlight(x.geo.boundary)}</div></div>`:'';return `<article class="item" data-id="${x.id}"><div class="node-main"><div class="c-name"><div class="name-line"><span class="scene-name">${highlight(x.name)}</span></div><div class="description">${highlight(x.description)}</div><div class="tags">${tagHtml(x)}</div></div><div class="c-process">${stepsHtml(x.workflow)}${extra}</div><div class="c-value"><div class="value-text">${highlight(x.impact)}</div><div class="inline-pick"><button type="button" class="select-btn ${state.selected.has(x.id)?'in':''}" data-select="${x.id}" aria-pressed="${state.selected.has(x.id)}">${state.selected.has(x.id)?'✓ 已加入调研清单':'+ 加入调研清单'}</button></div></div></div></article>`}
function groupHtml(name,list,domainId){const id=domainId+'|'+name,fold=state.closed.has(id);return `<section class="wf" data-group="${escapeHtml(name)}"><button type="button" class="wf-head ${fold?'folded':''}" data-toggle-group="${escapeHtml(id)}" aria-expanded="${!fold}"><svg class="chev" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wf-name">${highlight(name)}</span><span class="wf-count">${list.length} 个机会点</span></button><div class="wf-body ${fold?'folded':''}"><div class="cols"><div>需求场景 / 应用描述</div><div>自动化机会点（详细描述）</div><div>效能变化 / 需求选择</div></div>${list.map(rowHtml).join('')}</div></section>`}
function contentHtml(){const d=domains.find(z=>z.id===state.domain)||domains[0],group=byDomain(d.name);const groups=[...new Set(group.map(x=>x.group))];const geoNotice=d.id==='02'?`<aside class="geo-info"><div class="ico">✨</div><div><strong>品牌 GEO · AI 搜索可见度运营</strong><p>与传统 SEO 并列，围绕目标问题、AI回答、品牌事实、内容发布与周期复测建立监测闭环。GEO为可探索的方案场景，不承诺AI引用或推荐排名。</p></div></aside>`:'';let out=`<header class="dept-hero"><div><h1 class="dept-heading">${d.icon} ${escapeHtml(d.name)}</h1><div class="dept-lead">${escapeHtml(d.description)}<br>每条场景的应用描述、详细自动化机会点与效能变化直接呈现在表格中，无需展开详情。</div></div><div class="stats"><div class="stat"><div class="stat-num">${group.length}</div><div class="stat-label">自动化机会点</div></div><div class="stat"><div class="stat-num">${groups.length}</div><div class="stat-label">业务场景组</div></div></div></header>`+geoNotice;
if(group.length===0)return out+`<div class="empty"><strong>当前业务链路没有匹配的场景</strong>试试切换业务链路，或者清除搜索词和能力筛选。</div>`;
out+=`<div class="section-tools"><button class="plain-btn" data-groupall="open">全部展开</button><button class="plain-btn" data-groupall="close">全部收起</button></div>`;
out+=groups.map(g=>groupHtml(g,group.filter(x=>x.group===g),d.id)).join('');return out+`<div class="bottom-note">共 ${group.length} 个场景。这里的自动化描述为需求启发和方案沟通参考，具体接口、操作权限、异常处理与实际效益以客户验证为准。</div>`;}
function render(){const mt=matched();if((state.q||state.tech!=='all')&&byDomain(activeName()).length===0&&mt.length>0)state.domain=domains.find(d=>mt.some(x=>x.domain===d.name)).id;$('#sidebar').innerHTML=navHtml();$('#content').innerHTML=contentHtml();$('#visibleCount').textContent=mt.length;$('#clearSearch').style.display=state.q?'block':'none';document.querySelectorAll('#techFilters .fbtn').forEach(b=>{b.classList.toggle('active',state.tech===b.dataset.tech);b.setAttribute('aria-pressed',state.tech===b.dataset.tech)})}
function switchDomain(id){state.domain=id;history.replaceState(null,'','#'+id);render();window.scrollTo({top:0,behavior:'smooth'})}
function selectItem(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render()}
function csvExport(){const saved=items.filter(x=>state.selected.has(x.id));if(!saved.length)return;const columns=['编号','业务链路','业务场景组','需求场景','应用描述','自动化机会点','效能变化'];const values=saved.map(x=>[x.id,x.domain,x.group,x.name,x.description,x.workflow,x.impact]);const quote=v=>'"'+String(v||'').replaceAll('"','""')+'"';const csv='\ufeff'+[columns,...values].map(row=>row.map(quote).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='独立站自动化需求调研清单_'+saved.length+'项.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
document.addEventListener('click',ev=>{const nav=ev.target.closest('.side-link');if(nav){switchDomain(nav.dataset.id);return}const group=ev.target.closest('[data-toggle-group]');if(group){const k=group.dataset.toggleGroup;state.closed.has(k)?state.closed.delete(k):state.closed.add(k);render();return}const sel=ev.target.closest('[data-select]');if(sel){selectItem(sel.dataset.select);return}const tech=ev.target.closest('#techFilters .fbtn');if(tech){state.tech=tech.dataset.tech;render();return}const all=ev.target.closest('[data-groupall]');if(all){const d=activeName();[...new Set(byDomain(d).map(x=>x.group))].forEach(g=>all.dataset.groupall==='open'?state.closed.delete(state.domain+'|'+g):state.closed.add(state.domain+'|'+g));render();return}if(ev.target.closest('#exportSelected')){csvExport();return}if(ev.target.closest('#resetSelected')){state.selected.clear();render();return}});
$('#search').addEventListener('input',e=>{state.q=e.target.value.trim();render()});
$('#clearSearch').addEventListener('click',()=>{$('#search').value='';state.q='';render();$('#search').focus()});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(domains.some(d=>d.id===id)){state.domain=id;render()}});
render();
})();
</script>
</body>
</html>
