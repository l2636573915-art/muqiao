<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跨境电商业务训练营</title>
<style>
:root{color-scheme:light;--ink:#172c32;--muted:#50666a;--paper:#f4f7f5;--card:#fff;--line:#d7e2dd;--teal:#0b6959;--tint:#e5f4ed;--amber:#825006;--warm:#fff3d8;--rail:#173438;--rail-text:#dcece8;--rail-muted:#b6d0c9;--radius:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button,a,input,select,summary{-webkit-tap-highlight-color:transparent}
button,summary,select{cursor:pointer}
a{color:var(--teal);text-underline-offset:4px}
:focus-visible{outline:3px solid #0ba387;outline-offset:3px}
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-text);padding:26px 20px;min-width:0}
.rail-inner{position:sticky;top:22px}
.rail summary{font-weight:680;font-size:1.12rem;padding:4px 0 12px}
.control{display:grid;gap:4px;margin-bottom:12px;font-size:.875rem;color:var(--rail-muted)}
.control input,.control select{width:100%;min-height:44px;border:1px solid #567374;border-radius:10px;padding:8px 10px;background:#224447;color:white}
.control input::placeholder{color:#c2d8d2}
.filter{display:flex;gap:8px;align-items:center;font-size:.875rem}
.filter input{accent-color:#80dcbd;inline-size:16px;block-size:16px}
.result{color:var(--rail-muted);font-size:.82rem;margin:10px 0 4px}
.course-list{display:grid;gap:4px;max-height:calc(100vh - 310px);min-height:142px;overflow:auto;padding:4px 4px 6px 2px;scrollbar-color:#749693 transparent}
.course-list button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:10px;color:var(--rail-text);background:transparent;min-height:42px;font-size:.875rem}
.course-list button:hover{background:#264d4e}
.course-list button[aria-current=true]{background:#d5ede4;color:#12463e;font-weight:680}
.course-count{font-size:.75rem;white-space:nowrap;font-variant-numeric:tabular-nums}
main{width:min(100%,1090px);margin:0 auto;padding:36px clamp(20px,5vw,70px) 44px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.65rem,3.45vw,2.65rem);line-height:1.14;letter-spacing:-.04em}
.top p,.subtle{color:var(--muted);font-size:.88rem}
.top p{margin-top:8px}
.meter{width:clamp(135px,23%,210px);flex-shrink:0}
.meter label{display:block;font-size:.8rem;font-weight:650;margin-bottom:4px}
progress{display:block;width:100%;height:8px;accent-color:var(--teal)}
.overview{margin-bottom:26px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#edf3ef;display:grid;gap:12px}
.overview-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.overview-head h2{font-size:1.14rem}
.overview-current{font-size:.85rem;color:var(--teal);font-weight:680}
.map-route{display:grid;gap:9px}
.map-phase{display:grid;gap:5px;min-width:0}
.map-phase h3{color:var(--ink);font-size:.90rem;font-weight:650}
.map-start{max-width:510px;width:100%;justify-self:center}
.map-start h3{text-align:center}
.map-lane{display:grid;grid-template-columns:minmax(0,1fr) 19px minmax(0,1fr);align-items:stretch}
.map-arrow{align-self:center;text-align:center;color:#4e746b;font-size:1rem;line-height:1}
.map-fork{position:relative;text-align:center;font-size:.82rem;color:var(--muted);padding:8px 0 2px}
.map-fork::before{content:"";position:absolute;inset:0 25% 0;border-top:1px solid #9bb6ad;border-left:1px solid #9bb6ad;border-right:1px solid #9bb6ad}
.map-fork span{position:relative;background:#edf3ef;padding:0 8px}
.map-branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.map-branch{padding:9px 10px 10px;border-radius:12px;background:#e0ede7}
.map-branch.supply{background:#e6edf4}
.supply .map-arrow{color:#4a6680}
.map-join{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:9px 10px;border-top:1px solid var(--line)}
.map-join p{color:var(--muted);font-size:.84rem}
.map-join .map-stage{min-height:44px;padding-inline:10px}
.map-stage{min-height:61px;padding:7px 4px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-weight:650;font-size:.85rem;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.map-deliverable{display:block;margin-top:4px;color:var(--muted);font-size:.72rem;font-weight:500}
.map-stage:hover{border-color:var(--teal)}
.map-stage[aria-pressed=true]{border-color:var(--teal);background:var(--tint);color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.map-stage[aria-current=step]{background:var(--teal);border-color:var(--teal);color:white}
.map-stage[aria-current=step] .map-deliverable{color:#e0f4ec}
.map-relationships{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;color:var(--muted);font-size:.82rem}
.map-relationships button{min-height:44px;padding:5px 9px}
.map-reference{margin:0;font-size:.84rem;color:var(--muted)}
.map-context{border-top:1px solid var(--line);padding-top:11px;display:grid;gap:10px;min-width:0}
.map-context h3{font-size:.96rem}
.map-io{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 16px;margin:0}
.map-io dt{color:var(--muted);font-size:.82rem;font-weight:650}
.map-io dd{margin:2px 0 0;font-size:.88rem;overflow-wrap:anywhere}
.map-return{font-size:.84rem;color:var(--muted)}
.map-return button{padding:3px 0;background:none;border:0;color:var(--teal);font:inherit;text-decoration:underline;text-underline-offset:3px}
.map-courses summary{color:var(--teal);font-size:.88rem;font-weight:680;padding:4px 0}
.map-course-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px;margin-top:5px;max-height:220px;overflow:auto;padding:4px}
.map-course-list button{display:flex;justify-content:space-between;gap:6px;text-align:left;font-weight:500;overflow-wrap:anywhere}
.map-course-list button[aria-current=true]{background:var(--tint);border-color:var(--teal);color:var(--teal);font-weight:680}
.map-course-list .course-count{align-self:center;color:var(--muted)}
.course{border-top:1px solid var(--line);padding-top:21px}
.course-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.batch-controls{display:grid;gap:4px;justify-items:end;text-align:right}
.batch-progress{font-size:.83rem;color:var(--muted)}
.batch-controls .btn:disabled{opacity:.65}
.course-meta{font-size:.85rem;color:var(--teal);font-weight:680;margin-bottom:5px}
h2{font-size:clamp(1.45rem,3vw,2rem);line-height:1.23;letter-spacing:-.025em;overflow-wrap:anywhere}
.flow{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px;padding:0;align-items:center}
.flow li{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.82rem}
.flow span{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:3px 8px;color:var(--ink)}
.flow-button{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:5px 8px;color:var(--ink);min-height:38px}
.flow-button:hover{border-color:var(--teal)}
.flow li[aria-current=step] .flow-button{background:var(--tint);color:var(--teal);border-color:var(--teal);font-weight:650}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden;box-shadow:0 8px 30px #1734380d}
.card-intro{padding:clamp(18px,4vw,30px);display:grid;gap:12px}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.card-kind{font-weight:700;color:var(--teal)}
.card-location{border:0;padding:4px 0;background:none;color:var(--teal);font:inherit;text-decoration:underline;text-underline-offset:3px}
.card-kind.practice{color:var(--amber)}
h3{font-size:clamp(1.24rem,2.6vw,1.75rem);line-height:1.38;letter-spacing:-.02em}
.btn{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px 14px;min-height:44px;font-weight:650;font-size:.88rem}
.btn:hover{border-color:var(--teal);background:var(--tint)}
.btn:disabled{opacity:.46;cursor:default}
.primary{background:var(--teal);color:white;border-color:var(--teal)}
.primary:hover{background:#095746}
.quiz-form,.quiz-field{display:grid;gap:9px}
.quiz-form{margin-top:4px}
.quiz-form .primary{justify-self:start}
.quiz-field label,.quiz-choices legend{font-size:.9rem;font-weight:650}
.quiz-field textarea{resize:vertical;padding:11px 12px;border:1px solid #aabdb5;border-radius:10px;min-height:104px;width:100%;color:var(--ink);background:var(--card);font:inherit}
.quiz-choices{display:grid;gap:7px;min-width:0;margin:0;padding:0;border:0}
.quiz-choices legend{margin-bottom:6px}
.quiz-option{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.quiz-option:has(input:checked){background:var(--tint);border-color:var(--teal)}
.quiz-option input{margin-top:6px;accent-color:var(--teal);flex:none}
.quiz-error{color:var(--amber);font-size:.87rem;font-weight:650}
.grade-title{margin:0;font-size:1.1rem;color:var(--teal)}
.grade-title[data-grade=review]{color:var(--amber)}
.grade-points{display:grid;gap:3px;margin:0;padding-left:1.2em;font-size:.9rem}
.grade-points li[data-hit=false]{color:var(--amber)}
.submitted{background:var(--card);border-radius:9px;padding:8px 11px;overflow-wrap:anywhere}
.answer{padding:20px clamp(18px,4vw,30px);background:var(--tint);border-top:1px solid var(--line);display:grid;gap:10px}
.answer-label{color:var(--teal);font-size:.85rem;font-weight:700}
.answer p{white-space:pre-line}
.actions,.nav,.sources{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .btn[aria-pressed=true]{background:var(--teal);color:white;border-color:var(--teal)}
.actions .review[aria-pressed=true]{background:var(--warm);color:var(--amber);border-color:#e1c580}
.nav{margin:12px 0 20px;justify-content:space-between}
.nav .subtle{margin-inline:auto}
.sources{border-top:1px solid var(--line);padding-top:14px;font-size:.85rem;gap:8px 14px}
.sources a{font-weight:650}
.footer{margin-top:20px;color:var(--muted);font-size:.82rem}
@media(max-width:830px){.shell{grid-template-columns:250px minmax(0,1fr)}.rail{padding:22px 15px}.top{align-items:start;flex-direction:column;gap:14px;margin-bottom:22px}.meter{width:100%;max-width:260px}}
@media(max-width:640px){.shell{display:flex;flex-direction:column}.rail{padding:10px 16px}.rail summary{padding:6px 0}.rail-inner{position:static}.course-list{max-height:35vh;min-height:0}main{padding:19px 15px 32px}.nav .subtle{order:-1;flex-basis:100%;text-align:center}.answer{padding-block:16px}}
@media(max-width:820px){.map-branches{grid-template-columns:1fr}.map-fork::before{inset-inline:50%;border-right:0}.map-fork{padding-top:5px}}
@media(max-width:430px){.map-join{grid-template-columns:1fr;padding-inline:0}.map-join .map-stage{width:100%}}
@media(max-width:430px){.overview{padding:12px}.map-io,.map-course-list{grid-template-columns:1fr}.map-stage{font-size:.82rem}.map-return button{min-height:44px}}
@media print{.shell{display:block}.rail,.overview,.nav,.actions,.quiz-form,.meter{display:none}main{padding:0}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <details class="rail-inner" id="directory" open>
      <summary>课程目录</summary>
      <label class="control">搜索课程<input id="search" type="search" placeholder="例如 补货、TEMU、对账" autocomplete="off"></label>
      <label class="control">业务主题<select id="theme"><option value="">全部主题</option></select></label>
      <label class="filter"><input id="review-only" type="checkbox">仅显示含待复习卡的课程</label>
      <p class="result" id="results" role="status"></p>
      <nav id="course-list" class="course-list" aria-label="选择课程"></nav>
    </details>
  </aside>
  <main>
    <noscript>请在允许 JavaScript 的浏览器中打开，以使用课程、问答和进度记录。</noscript>
    <header class="top">
      <div><h1>跨境电商业务训练营</h1><p id="catalog-summary"></p></div>
      <div class="meter"><label for="progress" id="progress-label">已掌握</label><progress id="progress"></progress></div>
    </header>
    <section class="overview" aria-labelledby="map-title">
      <div class="overview-head">
        <h2 id="map-title">跨境电商全景业务链路</h2>
        <span class="overview-current" id="map-current" aria-live="polite"></span>
      </div>
      <div class="map-route" role="group" aria-label="从商品决策分流到运营和供应链，再进入结算">
        <section class="map-phase map-start" aria-labelledby="map-prepare-title">
          <h3 id="map-prepare-title">共同起点</h3>
          <div class="map-lane" id="map-prepare"></div>
        </section>
        <p class="map-fork"><span>定品后可并行推进</span></p>
        <div class="map-branches">
          <section class="map-phase map-branch" aria-labelledby="map-operate-title">
            <h3 id="map-operate-title">商品运营线</h3>
            <div class="map-lane" id="map-operate"></div>
          </section>
          <section class="map-phase map-branch supply" aria-labelledby="map-supply-title">
            <h3 id="map-supply-title">库存与履约线</h3>
            <div class="map-lane" id="map-supply"></div>
          </section>
        </div>
        <div class="map-join">
          <p>刊登和库存就绪后开售。成交订单交给履约，销售、退款与履约费用汇入结算。</p>
          <div id="map-settle"></div>
        </div>
      </div>
      <div class="map-relationships" id="map-relationships" aria-label="其他业务支线"></div>
      <div class="map-context" id="map-context">
        <h3 id="map-stage-title"></h3>
        <dl class="map-io">
          <div><dt>承接什么</dt><dd id="map-input"></dd></div>
          <div><dt>交付给谁</dt><dd id="map-output"></dd></div>
        </dl>
        <p class="map-return" id="map-return"></p>
        <details class="map-courses" id="map-courses">
          <summary id="map-courses-label">相关问答课程</summary>
          <div class="map-course-list" id="map-course-list" aria-label="选中环节的课程"></div>
        </details>
      </div>
      <p class="map-reference">这是一张经营学习地图。各平台的准入、刊登、履约和结算规则按具体站点及经营模式核对。</p>
    </section>
    <section class="course" aria-labelledby="course-title">
      <div class="course-head">
        <div><p class="course-meta" id="course-meta"></p><h2 id="course-title"></h2></div>
        <div class="batch-controls">
          <p class="batch-progress" id="batch-progress" aria-live="polite"></p>
          <button type="button" class="btn" id="next-batch" aria-describedby="batch-progress">换一批</button>
        </div>
      </div>
      <ol class="flow" id="flow" aria-label="业务步骤"></ol>
      <article class="card" aria-labelledby="question">
        <div class="card-intro">
          <div class="card-meta"><span class="card-kind" id="card-kind"></span><button type="button" class="card-location" id="card-location" aria-controls="map-context"></button><span id="card-status"></span></div>
          <h3 id="question" aria-live="polite"></h3>
          <form class="quiz-form" id="quiz-form" novalidate>
            <fieldset class="quiz-choices" id="quiz-choices" hidden>
              <legend>选择一个答案</legend>
              <div class="quiz-choices" id="quiz-options"></div>
            </fieldset>
            <div class="quiz-field" id="quiz-text" hidden>
              <label for="answer-input">你的答案</label>
              <textarea id="answer-input" rows="3" maxlength="1800" aria-describedby="quiz-help" placeholder="写下你的判断、依据或下一步动作"></textarea>
              <p class="subtle" id="quiz-help">简答按业务要点初评，提交后可对照参考答案。</p>
            </div>
            <p class="quiz-error" id="quiz-error" role="alert" hidden></p>
            <button type="submit" class="btn primary" aria-controls="answer">提交并批改</button>
          </form>
        </div>
        <section class="answer" id="answer" hidden>
          <h4 class="grade-title" id="grade-title" tabindex="-1"></h4>
          <p class="submitted" id="submitted"></p>
          <ul class="grade-points" id="grade-points" hidden></ul>
          <div class="answer-label" id="answer-label">参考答案</div>
          <p id="answer-text"></p>
          <div class="actions">
            <button type="button" class="btn" id="retry">重新作答</button>
            <button type="button" class="btn review" id="mark-review" aria-pressed="false">待复习</button>
            <button type="button" class="btn" id="mark-known" aria-pressed="false">已掌握</button>
          </div>
        </section>
      </article>
      <div class="nav" aria-label="卡片翻页">
        <button type="button" class="btn" id="previous">上一张</button>
        <span class="subtle" id="position" aria-live="polite"></span>
        <button type="button" class="btn" id="next">下一张</button>
      </div>
      <div class="sources" id="sources" aria-label="知识库原卡"></div>
      <p class="footer">问答和情景为学习整理。具体审核、投放与履约规则以目标站点现行要求为准。</p>
      <p class="footer" id="storage-note">学习记录保存在当前浏览器，移动文件或换浏览器时，记录可能需要重新建立。</p>
    </section>
  </main>
</div>

<!-- 每行一课：编号 | 名称 | 业务步骤（用 → 分隔） | 问题 | 答案 ...；最后一题为情景练习。 -->
<script type="text/plain" id="course-data">
START|亚马逊新品上架八阶段|商品建档→合规检查→市场研究→关键词研究→内容生产→视觉生产→上架准备→上传运营|商品建档时为什么先确定 SKU 和变体？|同一款桌面理线夹的黑白两色可以各建一个 SKU，再确认目标类目允许使用颜色变体主题。SKU 管卖家自己的库存与报价，ASIN 标识平台目录商品。交付商品主数据表和变体关系表，文案、素材、报价和结果都按 SKU 对齐。|合规检查要给下游什么？|核查站点和类目准入、适用认证、危险品和知识产权。把证明材料、禁止使用的表述和待复核项交给文案与设计。比如只实测了木质和金属桌面，就按已验证的范围描述适用性。|市场研究结束后应确定什么？|明确谁会买、遇到什么问题、为什么会选择这款。用竞品 ASIN、定价和评论交叉验证，再把目标人群、使用场景、价格带与可兑现的卖点交给关键词和内容团队。|关键词表怎样交给运营？|记录每个词的来源、相关度和用途。品类词可用于标题，尺寸和场景词可用于五点或描述，符合要求的补充词可用于后台搜索词，广告测试词单独管理。|内容和视觉怎样衔接？|文案先确认商品事实、标题、五点、描述和站点语言版本；有资格时规划 A+。设计据此确定每张图解决的购买问题，并按 SKU 核对颜色、包装数量、规格和文案承诺。|视觉生产需要验收什么？|主图、尺寸图、场景图和包装图按目标站点要求验收。尺寸图只用实测值，包装图只展示随货内容。审核通过的图片、视频和可选 A+ 素材按站点及 SKU 交接。|上架准备要把哪些条件落实？|用采购、平台佣金、物流及预计退货费用核算利润，确认 FBA 或 FBM 履约、首批库存和预计可售日期。合并主数据、文案、视觉和合规材料，经复核后提交。|怎么判断成功上架？|分别确认后台处理成功、前台展示正确、买家可购买。逐个检查变体、库存、价格与配送，记录 SKU 与 ASIN 对应关系，再进入广告、评价和库存跟进。|黑色款可购买，白色款后台提交成功却不可购买，下一步做什么？|定位白色 SKU，核对报价是否生效、可售库存和履约状态，查看是否缺属性或受到限制。记录异常和负责人，修复后复验白色款的购买入口，再决定是否推广。
001|评论反推选品链路|评论采集→痛点聚类→高频问题→机会判断→产品定义|评论中的高频差评怎样变成选品线索？|按竞品、版本和使用场景整理评论，把同义问题聚类，再区分产品设计缺陷、配送损坏和个别偏好。设计缺陷若跨多款商品重复，且买家真正在意，才值得进入候选机会表。|候选机会如何交给产品团队？|把原始评论证据、受影响人群、发生场景、现有替代方案和拟改进指标放在同一张表。用成本、供应能力和小样验证可行性，输出可验收的产品规格。|大量差评说“太小”，可以直接要求工厂放大一倍吗？|先辨别是规格真的不适用，还是页面没把尺寸说清。用评论场景和竞品尺寸分布判断目标用户，再决定改规格、补尺寸图或新增规格款。
002|竞品深度拆解链路|建立竞品池→采集页面→拆解卖点→价格、评论与图片分析→优化建议|什么产品才算有效竞品？|先匹配目标人群、使用场景和功能，再匹配价位与规格。可把直接竞品和替代品分列。跨站点价格、不同套装件数和不同促销状态，要统一口径再比较。|拆解结果怎么变成具体建议？|交付竞品 ASIN 对照表，记录价格快照、图片顺序、主卖点、评论证据和采集日期。每条优化建议注明对应证据、预期解决的问题以及负责验证的岗位。|一家头部竞品销售很高、价格也更低，你会马上跟价吗？|先核对件数、规格、促销、配送与积累评价。算自己的成本和利润底线，并检查是否能靠规格或内容差异竞争，再决定是否做小范围价格测试。
003|Listing 运营链路|竞品采集→关键词采集→文案生成→评分排序→上架准备|新品 Listing 应从哪里起草？|用商品主数据锁定事实，用竞品和评价识别购买问题，用词库安排搜索词位置。运营将品牌、规格、禁用表述和目标语言一起交给文案生成环节。|文案有多稿时，评分能决定哪一版直接上线吗？|评分用来排序，重点看相关性、卖点清晰、可读性和字段齐全。运营终审逐句核对产品事实、站点规则及关键词。输出选中稿、修改记录和上传版本。|高分稿写了“防水”，主数据中没有测试结论，怎么办？|把该声称标为待证实，查测试报告与适用条件。证据缺失时改成已验证的材料和适用场景，复核通过再进入上传包。
004|评论 VOC 分析链路|采集→清洗→标签分类→差评聚类→用户洞察→优化建议|VOC 分析和查看平均星级有什么区别？|VOC 是用户声音，重点是买家在什么场景里为何满意或不满。清洗重复评论，按版本和站点拆分，再给材质、易用性、包装、物流等问题打标签。|分析结果怎样落地？|输出主题、样本数、代表评论、影响人群和改进动作。产品问题交产品团队，尺寸理解问题交页面运营，破损集中在特定运输批次时交供应链。|评论总量很少，三条差评都说破损，应怎么报告？|如实标注小样本与时间范围，先查包装批次和退货记录是否有同样信号。将结论写为需验证的风险，同时保留原始证据与负责人。
005|产品场景图生成链路|自家产品图→分析参考→锁定真实结构→生成方案→多版本出图→质检|给设计或 AI 的场景图任务应包含什么？|准备实物多角度照片、准确尺寸、材质颜色、目标使用场景和品牌风格。参考图只拆解光线、视角及信息层级，明确产品几何与标识需保持一致。|生成多张图后怎样验收？|按 SKU 对照实物，核查轮廓、接口、比例、套装数量和使用方式，再检查平台适用的图像规则。记录通过版本及拟使用的位置。|画面更漂亮，但 AI 多生成了一个接口，能用作副图吗？|先返工修正接口并重新核对。若生成环节不能稳定保持结构，就使用真实产品图合成场景背景，保留实物照片作为验真依据。
006|竞对参考素材替换链路|拆解参考→识别自家商品→规划原创构图→合成→局部修复→验收|竞品素材能给设计提供什么？|可提炼构图目的，例如先展示使用环境再突出细节。把自家产品实拍和有授权的背景、道具用于新稿，并记录素材来源及授权范围。|局部修复时重点看哪些地方？|看轮廓遮罩、透视、阴影和反光是否一致，检查品牌标志、包装与商品规格有没有被意外更改。最终交付独立设计源稿和可核验的素材清单。|参考图上的独特插画和文案很有效，设计师想直接保留，怎么处理？|先核对是否拥有对应使用权。无法确认时，用自己的插画、文字和构图表达同类卖点，并复核商品事实。
007|数码 3C 卖点图生成链路|识别产品→规划场景→制作参数图→制作功能图→整套交付|参数图优先解决什么问题？|兼容性与关键规格最能帮助买家下单。核对产品型号、接口、连接方式、尺寸和测试条件，统一单位、版本号与资料来源。|怎样把参数变成一套图？|先列用户问题，再给每张图分配独立任务。接口图表达连接方式、参数图展示核验数值、场景图展示使用条件。所有图和商品详情共用一份规格表。|同系列高配版支持某协议，低配版的素材可沿用吗？|按 SKU 核查型号能力。共用版式可以，文字、接口和协议标签应换成该版本已验证的内容；发布前检查变体图片绑定。
008|视频爆款内容分析链路|采集视频与指标→脚本拆解→提出原因假设→沉淀模板|拆解高表现视频时先看什么？|记录平台、日期、品类、账号规模和可得的播放或互动指标，再把视频拆成开场、场景、卖点证明和行动引导。尽量加入同类普通样本做对照。|怎样把观察变成可复用脚本？|保留可测试的结构与镜头作用，例如开场展示痛点、随后实测。把流量渠道或账号差异记为可能影响因素，用自家原创素材测试，并说明成功指标。|某视频播放最高，同时正好用了新开场，能断定开场有效吗？|把开场列为候选因素。控制商品、投放和发布时间等条件做对照测试，看留存或点击是否重复改善，再更新模板。
009|剪映草稿自动化链路|准备素材→规划镜头→生成草稿→批量处理→人工复核|自动生成草稿之前要提供什么？|提供已授权的素材、命名和版本、镜头顺序、字幕时间轴、画幅以及需要固定的产品画面。让项目模板接收有明确编号和长度的素材。|草稿生成后如何交接？|输出可编辑草稿、素材清单和预览。剪辑师核对镜头、缺失素材、字幕同步、音量和安全区，再审核并导出成片。|批量生成后发现两个 SKU 的镜头对调，先修模板还是成片？|先停用对应批次的成片，按 SKU 与素材 ID 找到映射错误，修正输入或模板后重生成受影响的草稿并逐项复核。
010|采购报价文件结构化链路|上传报价→识别类型→提取字段→标准表→复核→回填|供应商报价如何整理成能直接比较的表？|统一商品编码、规格、单位、币种、MOQ、阶梯单价、交期和有效期，同时记录含税及是否含运费。保留原文件与页码，缺值设为待确认。|什么情况下要阻止回填采购系统？|字段缺失、重复报价、金额与明细不符、币种或单位无法判定时转采购复核。确认后写入带来源与审核记录的台账。|一家报价按箱，另一家按件，哪个便宜？|向供应商确认每箱件数和报价条款，统一到单件含相同费用的口径后再比较。未确认换算比例之前保留原值，不参与排序。
011|物流单据结构化链路|上传运单→识别字段→结构化→异常校验→系统录入|从运单中要抓哪些信息？|按业务需要提取承运商、运单号、箱数、重量、目的地、关联货件和日期。存原件与原值，用统一格式另存标准字段供物流台账关联。|录入前怎样避免错配？|把运单号和货件编号与发货计划核对，检查箱数、目的地、重量单位和重复记录。识别结果不确定时由物流负责人复核。|图片模糊，可能是两个相近的运单号，怎么做？|标记低置信并暂停自动录入，向承运商或原始电子单核对。确认唯一编号再关联，留下修订前后值和证据。
012|亚马逊经营数据分析与业务动作链路|拉取市场与后台数据→统一口径→指标分析→运营动作→复评|经营分析要把哪些数据放在一起？|将业务报告、订单、广告、库存、结算或绩效按问题关联，先对齐站点、日期、币种和 SKU 或 ASIN。有些报表粒度不同，汇总到可比维度再看。|从指标变化怎么推到业务动作？|先定位变化来自访客、转化、售价、库存还是流量结构。每项动作写明证据、负责人、涉及 SKU 和复评时间，同时记录可能的混杂因素。|销量减少但广告点击没少，先查什么？|核对同期可售库存、购物车、价格和页面变化，再看业务报告转化及广告流量构成。按站点和 SKU 分解，找到销量下降主要发生的位置。
013|亚马逊 Listing 优化链路|采集业务报告→匹配竞品→Listing 质检→改写→字段优化→变更复核|已有 Listing 为什么要先诊断再改写？|建立流量、转化和页面内容基线，核对库存、价格和竞品情况。运营按标题、五点、图片、搜索词分别列问题，确定最值得改的字段。|改完怎么评估效果？|记录修改版本、站点、ASIN、时间和目标指标。用前后可比窗口观察访客、点击或转化，同时标注促销、库存和广告变化，必要时只测一类改动。|页面转化下降恰逢断货，应该先重写标题吗？|先分离断货和恢复期，查看可售时段的转化表现与购物车状态。补货后有持续问题，再用竞品和用户反馈支持内容改版。
014|亚马逊图片优化链路|输入现有图→竞品参考→场景图方案→视觉优化→人工复核→归档|已有图片要优化，应该先查哪张？|从要解决的购买问题出发。点击弱先检查主图辨识度与规格表达；买家常误解尺寸或配件时，重点补尺寸图或包装清单图。|如何保留优化前后的可比证据？|记录 ASIN、图片槽位、修改时间、原图和新图版本，核对目标站点的图像规范。观察点击或转化时标注广告、价格与库存变动。|改图后销量上涨，同时做了大额促销，能归功于图片吗？|先记录两项同时变化。选择更可比的时段或在适用条件下做受控测试，根据对应指标判断改图可能贡献。
015|亚马逊库存管理与补货链路|获取库存报告→区分可售与不可售→估算覆盖→判断风险→执行|运营为什么要看库存状态，而非只看总库存？|仓内可售、预留、不可售和在途会影响不同决策，不能全部当已可销售。用可售库存和预期销量估算覆盖天数，再把到货和入仓时间放在同一时间轴。|补货表应交付什么？|为每个站点 SKU 记录可售量、日销口径、预计到货、补货周期、安全库存与建议发货量。区分可能断货、需要催运和滞销三类，给出动作和负责人。|可售只够十天，在途预计十五天后可售，最先判断什么？|先确认日销是否包含促销和断货偏差，再核实预计可售日期及交期波动。若仍有缺口，计算可接受的加急量，协同控制投放或调整履约。
016|FBA 发货全链路|库存触发→创建货件→生成单据→物流下单→文件交接→成本回传|补货建议怎样变成实际 FBA 货件？|把目标 SKU、数量和到仓日期交给仓储物流，确认装箱、标签、实际重量和平台创建的目的仓。根据最终装箱数据生成运单和交接清单。|什么时候能把货转成可售预期？|仓库交接、承运商签收、平台收货和可售是不同事件。按货件号记录轨迹、签收证明、接收差异与费用，入仓后用平台库存状态更新台账。|承运商签收了，但亚马逊数量比发货少，直接把货件标完成吗？|标记收货差异，核对箱单、签收证明和平台接收进度。满足取证和调查条件后转异常或索赔，并保留历史数量。
017|亚马逊索赔链路|识别异常→确认索赔类型→准备证据→提交→跟进→赔付核对|发现库存或配送异常后，何时进入索赔？|先区分在途、待收货、数量差异、损坏及已自动补偿的情况。按站点现行政策核查事件资格和时间窗口，再为可申诉项建立记录。|索赔从提单到结案要记录哪些东西？|记录货件、SKU、异常数量、原始凭证、工单号、平台答复与实际到账金额。平台结案后对照赔付或调账流水，让财务据此确认处理结果。|同一个货件差异已有赔付，但仓库又收到同类异常，怎么办？|对照具体商品和数量，确认是否同一事件、是否补收或冲回。重复部分合并已有记录，新且符合条件的差异才单独处理。
018|亚马逊广告数据整理与排名监控链路|拉报表→统一字段→采集关键词位置→监控排名→跟踪投放状态|广告报表和关键词排名分别解释什么？|报表看展示、点击、花费和归因订单，排名快照看特定站点、位置和采样条件下的搜索可见性。记录自然位置和广告位置，按同口径趋势比较。|怎样建可用的监控表？|按站点、日期、ASIN、活动或关键词建关联，统一币种与归因时间。监控表分开展示排名变动、投放状态、预算受限和异常证据。|排名从第 8 掉到第 20，但广告转化稳定，要立刻加预算吗？|复查采样地区、时段和位置类型，再看连续趋势、曝光、预算与自然流量的关系。先确定问题属于可见性、采样波动还是投放供给。
019|亚马逊广告分析与周报链路|汇总报表→识别浪费与潜力→跨店对比→行动建议→周报|怎样判断一个搜索词值得保留、降价还是排除？|结合实际相关性、点击、花费、转化、利润目标与归因成熟度。高相关但样本少的词继续观察，足量数据下长期超成本的词考虑降价或排除。|广告周报怎样交付给运营？|把异常词、机会词和店铺对照分列，写明比较区间、证据、建议动作、负责人和复查日期。跨店铺比较时先统一币种、站点和归因口径。|某词近两天花费上升、暂时无单，是否应该立即否定？|核对词是否相关，以及点击与归因是否足以判断。明显错意图可优先处理，相关词结合历史表现和成熟窗口再决定。
020|亚马逊广告调控系统搭建链路|采集→配置规则→预算与结构监控→异常提醒→审核动作→复盘|将运营经验写成规则需要哪些条件？|给规则定义适用站点和活动、指标窗口、最小样本、预算边界、处理动作和例外。避免同一活动同时命中相互冲突的加减预算规则。|怎样上线规则比较稳妥？|先用历史数据回放，再以仅提示模式查看命中和误报。记录建议、人工确认、执行时间与前后配置，设置调整上限及可回查的变更记录。|多个规则同时建议提高同一活动预算，如何处理？|按活动汇总为一条建议，检查优先级、总额度和库存风险，由审批人决定调整值，保留规则命中记录以便追溯。
021|付款与结算报表链路|下载付款与结算报表→核对费用→标记异常→归档|付款报告为什么需要搭配结算明细？|付款报告用于确认期间和打款结果，结算明细解释销售、退款、平台费用和其他调整，再和银行或收款工具实际到账匹配。|结算资料包至少包含什么？|同一店铺和账期的结算编号、报表原件、实际到账凭证、费用分类结果和差异清单。保留原币及折算依据。|打款到账少于预计金额，先检查哪几项？|先检查是否在同一转账和账期，再看预留、跨期退款、平台费、收款手续费及汇兑影响。证据不足时保留差异，交给对账负责人。
022|跨境财务场景地图链路|采集→处理→对账→核销→核算→入账→合规|七个财务步骤各交付什么？|采集拿原始证据，处理产出统一数据，对账给出差异，核销确认哪笔欠款已结清，核算产出收入费用及利润，入账生成会计凭证，合规整理申报与审计资料。|财务自动化从哪个环节切入？|先看哪里耗时、规则清不清楚、证据是否可追。可以用一店一账期验证报表采集、字段标准化和对账，确认异常分流后再接入核销或凭证系统。|老板问“能否自动出利润”，但平台账单缺了一期，先做什么？|列出缺失账期和数据源，补齐原始证据并对账。阶段数据可以标为暂估，正式核算前由财务确认范围和差异处理结果。
023|店铺绩效与巡店链路|采集状态→巡检订单、库存、广告与商品→识别风险→指派→复核归档|巡店和做经营周报有什么区别？|巡店面向需及时处理的异常，例如履约超时、商品不可售、库存告急、账户健康提示。周报更侧重趋势和资源分配。巡店要能定位到店铺及具体对象。|异常通知必须有哪些信息？|带上站点、店铺、订单或 SKU、发现时间、证据、严重程度、处理人和截止时间。原问题修复后再更新状态，避免同一异常反复提醒。|广告仍在花费，巡店同时发现商品不可售，先做什么？|确认受影响 ASIN 和不可售原因，交给运营判断暂停对应推广。修复页面或库存后验证可购买，再按审批或运营规则恢复。
024|品牌分析链路|下载品牌报表→读取查询与购物篮→分析买家行为→制定运营动作|搜索查询和购物篮信息分别回答什么？|搜索查询帮助看品牌在哪些搜索需求中获得曝光、点击和购买。购物篮信息帮助识别商品被搭配购买的线索。选择店铺有权限且具备对应粒度的报表。|如何把信息转成选品或页面动作？|按查询和产品整理曝光、点击、购买等断点，匹配商品卖点或缺失场景。对搭配信号给出组合包候选，核算需求与成本后小范围验证。|数据显示两件商品常一起买，就应该立即做捆绑销售吗？|检查相关样本、适用站点和时间窗口，验证搭配是否长期存在，再核算定价、包装、库存和履约成本。
025|跨境财务采集链路|列出数据源→导出→分账号归档→记录余额与结算状态→留日志|每月关账前怎样知道资料集齐了？|用清单列平台、ERP、银行、收款工具和税务的数据源，指定账号、站点、账期、报表及负责人。每份文件有下载时间、完整性校验和缺失原因。|采集日志怎样支持重跑和审计？|保存报表类型、账号、日期区间、文件标识及抓取结果。补采新版本时保留原件和区别，记录哪个版本用于本期处理。|导出任务成功，但文件只有表头，如何入库？|先核对筛选范围和后台是否确实无交易，记录为已验证的零数据或采集失败。标记清楚后再通知下游。
026|跨境财务处理链路|获取非标文件→字段识别→结构化→清洗→生成台账|PDF 结算单和平台导出表怎样统一？|保留原件，提取结算编号、日期、金额、币种、收入费用分类及原文位置。标准值单独生成，统一日期、正负号和小数精度。|台账交接前如何验收？|校验关键字段、去重、按账单对总额，并抽查原文与结构化值。格式无法判断或金额不平时，把记录放入复核清单。|文件中括号包住金额，系统读成正数，怎样修正？|回查报表对括号和退款的定义，用总额验证负号口径。补齐规则，对同类记录重跑并保留原值与修订记录。
027|跨境财务对账链路|平台账单→ERP 订单匹配→收款流水匹配→识别差异→跟进|为什么平台、ERP 和银行要分两层匹配？|平台交易明细可对订单或退款，银行到账通常对应一笔包含多订单的结算。先核对交易层，再以结算编号或资金凭证核对打款总额。|差异清单怎样做才好处理？|区分时间差、退款、手续费、汇率差及缺单。留应有金额、实有金额、币种、参考编号、证据和责任人，并跟踪原因与结论。|有三笔订单在平台有、在 ERP 没有，但银行打款已对平，能关账吗？|交易层差异仍需核对订单同步、时间范围和退款记录。记录差异证据，按财务复核结论补录或列作待处理项。
028|跨境财务核销链路|读取应收应付→匹配收付款→识别未核销项→生成记录→跟进|对账之后为什么还有核销？|对账回答金额和记录能否匹配。核销把已确认的收付款分配到具体应收应付，更新欠款余额，并保留一笔付款如何分摊的记录。|部分回款或多单合并回款怎么处理？|按可证实的匹配关系分配，记录每笔被核销金额与剩余余额。无法定位的资金交财务待确认，避免错误结清。|供应商一笔回款金额等于两张单据总额，但没附清单，能核销吗？|查询付款方、币种、日期和参考号，向负责方确认分摊依据。确认后再按各单金额核销并留凭证。
029|跨境财务核算链路|归集收入→归集费用→处理汇率与汇损→核算利润→复盘|店铺月销售额高，为什么 SKU 仍可能亏损？|收入还要扣退款、采购、平台佣金、配送、广告和按规则归集的共用费用。用同一账期和币种算 SKU 或站点利润，再解释亏损来源。|利润表如何让别人复核？|标注收入、成本与费用来源，明确汇率日期和规则、分摊依据、暂估项及差异。把总账或结算汇总与经营口径的差异列清。|财务利润与运营表相差很大，优先核对什么？|对齐确认期间、退货、广告归因、成本和汇率，再逐层做收入费用桥接，定位哪些是口径差异、哪些是漏算。
030|跨境财务凭证与入账链路|确认核算结果→匹配凭证规则→生成→导入→验证|核算结果如何转换为可入账的凭证？|财务确认科目、借贷方向、币种、会计期间和单据归属，按映射生成凭证并检查借贷平衡。附上底稿和业务编号供追溯。|导入结束后怎样证明已经入账？|核对导入成功行、失败行、凭证号、账期与金额总和，通过财务系统状态和总账抽查确认，同时检查是否重复。|导入只成功一半，能原样把整包重提吗？|先核对已成功凭证的业务编号和批次，将失败项单独修复，再按系统规则重试并复核全批汇总。
031|跨境财务合规资料链路|收集合规材料→整理 VAT 或退税资料→校验→归档→提示风险|申报和审计资料为什么需要按主体、市场和月份归档？|不同经营主体、市场、税号和期间的交易与申报责任可能不同。整理适用的销售、退款、物流单据和申报凭证，保留原始来源及版本。|交给税务负责人之前要做什么？|核对账期、币种、税号、金额与账单是否一致，列出缺失凭证、异常处理及截止时间，由专业负责人确认申报口径。|平台报告与申报底稿中的销售额不一致，怎么办？|先排查税含价、退款、日期和交易归属，再找出解释不了的差额并补证，交税务人员确认处理。
032|服装视频采集与素材整理链路|采集参考→统一命名→提取 SRT 字幕→归档|参考视频和可用于成片的素材怎样管理？|参考素材保留出处、平台、链接和采集时间以便分析。实际使用素材另存授权范围、SKU 和版本。文件名能关联视频与对应字幕。|提取字幕后为什么仍需人工复核？|语音识别容易误读品牌、面料和专有词，时间戳也可能偏移。通过抽查音画同步与术语，交付可搜索的字幕和片段索引。|两条同名视频分别是原版和二次剪辑，怎样存？|用来源及版本生成不同标识，分别保留链接和授权。字幕和时间段按实际版本绑定，避免把两条的表现数据合并。
033|服装视频分析与爆款脚本链路|输入视频→解析画面→分段→提炼结构→输出脚本和拍摄计划|服装视频分段时重点提取哪些信息？|逐段记录镜头时间、景别、模特动作、口播和要传达的卖点。例如上身效果、材质细节和不同角度各解决一个购买疑问。|怎样把参考结构变成自己的脚本？|把可借鉴的叙事顺序转化成镜头清单与拍摄要求，用自己的模特、商品、实测尺码和授权素材，复核实际版型及颜色。|参考脚本夸大显瘦效果，准备照稿拍摄怎么办？|改成能够直接展示和核验的版型、实测尺寸或试穿画面，核对模特与商品信息，再确定脚本和字幕。
034|服装视频剪辑动作链路|素材准备→切片→混剪→生成草稿→插入特写→导出|智能混剪要提前锁定哪些素材规则？|用 SKU、色号、拍摄场景和镜头标签建立素材清单，限定每段时长与用途。标注哪些款式、颜色和配件必须一致。|成片导出前怎样做人工质检？|重点看特写与上下文是否对应、字幕是否挡住服装、音乐和比例是否符合要求，并检查授权。输出成片和对应草稿版本。|主体是深蓝款，自动混剪插入黑色款细节，怎么处理？|查特写候选的色号标签，改过滤条件后替换对应片段，并逐段核对同期出现的款式、配件和字幕。
035|TEMU 商品管理链路|准备商品资料→批量刊登→核价→识别滞销→处理下架→回填状态|批量上架前要为每个 SKU 准备什么？|准备类目属性、图片、规格、合规材料、成本底线和待核价信息。按商品和变体校验资料完整性，再分批提交并记录平台处理状态。|核价结果和滞销标记怎样驱动后续动作？|核价结果与供货成本、物流及利润底线比较，形成接受或复核建议。滞销需结合观察周期、库存和活动安排，审批完成后再处理下架并回填。|平台核价低于成本，但已经有库存，该怎么处理？|重算实际履约与库存处置成本，评估改包装、调整供货、暂缓刊登或清货路径。由运营和供应链确认决策后更新状态。
036|TEMU 订单与发货链路|读取订单→筛选可备货→加入发货台→建单→核对发货→处理异常|什么订单可以进入备货与发货环节？|根据托管模式、订单状态、SKU 可用库存、承诺时效和拦截原因筛选。准备订单与实物的映射，异常单从批次分出。|确认发货前后各核对什么？|发货前核对包裹、数量和运单关联，具备实际发货依据后确认。发货后跟踪状态回传，记录失败原因和处理人。|批次里订单已建，但一单缺货，是否整批确认发货？|隔离缺货订单并保留异常处理记录，核对其余订单后按实际发货情况处理。及时沟通补货或平台允许的处置。
037|TEMU 采购与供应商协同链路|1688 寻源→同口径比价→询价议价→确认条款→留档|供应商比价时，怎样比较同一款的真实成本？|统一用途和规格、起订量、含税口径、包装、交期及运费条款，记录样品与量产价格。低价与质量、补货稳定性一并判断。|微信沟通完还要留下什么？|把接受的报价、有效期、品质要求、交期及责任写入采购协同记录，需要时由供应商书面确认，和采购单关联。|一家报价最低，但拒绝提供样品和规格书，怎么选？|保留该家报价作为未核实候选。优先评估能提供样品、规格与可验证交期的供应商，待证据补齐再做采购判断。
038|TEMU 退货与库存处理链路|识别滞销→核对仓与货权→退货或调拨→回填→跟踪异常|什么时候考虑退货，什么时候考虑调拨？|先查库存归属、仓别、托管模式、可售状况和处置费用，再评估退回、调拨或其他合规路径。动作前确认平台和仓库是否支持。|退货或调拨完成后要对哪些账？|记录原仓、目的仓、SKU、调拨或退货单号、数量、收货结果与费用。以实际收货和确认状态分别更新仓内、在途及可售库存。|已经发出 100 件调拨，目的仓只确认 95 件，怎么记？|记录已发 100、实际收 95、差异 5，保留签收与箱单资料，交仓库调查并依据复核结果调整。
039|TEMU 活动与经营数据链路|读取活动规则→核对价格与库存→报名→汇总数据→复盘|报名之前运营要看哪几项？|检查商品资格、活动时间、售价或折扣要求、库存、履约能力和利润底线。提交前列清每个 SKU 的入选或排除理由。|活动复盘怎样回答值不值得再参加？|把报名与实际上线状态对齐，比较活动前、中、后的销量、利润、退货、缺货情况，用可比基线评估增量及资源消耗。|活动预计拉高销量但利润率跌破店铺底线，怎么决定？|按预期增量、清库存价值和实际费用做情景测算。若需要例外，记录预算和结束条件，交负责人审批。
040|亚马逊广告自动化系统链路|识别新品 ASIN→生成投放结构→运营审核→发布执行→监控|新品投放结构通常怎样拆分？|按目的分别设计自动探索、手动关键词、商品定位等活动，给每项写清目标商品、预算、出价与禁用项，由广告运营验证。|机器执行怎样保留控制权？|先出活动草稿与变更清单，由运营确认店铺、站点和预算。执行后回写活动编号、异常和实际配置，后续规则按审批边界运行。|批量创建返回超时，脚本能直接重跑吗？|先查询已有活动和执行日志，按唯一批次定位已创建项，只重试确认缺失的活动，避免超预算和重复投放。
041|新品内容生成与多站点本地化链路|登记内容任务→生成 Listing→运营确认→上传审核→本地化素材与 A+|多站点本地化除了翻译还需要做什么？|保持共用商品事实，逐站适配计量单位、语境、搜索词、合规表达和素材。具有资格且确需发布时，另外准备适配站点的 A+ 内容。|飞书任务表在案例中起什么作用？|承接任务登记、生成稿和运营确认，关联源 SKU、站点、素材版本以及亚马逊处理状态。它可以用同等能力的现有任务系统替代。|英文版写了一组尺寸，德语图片转换后和包装规格不一致，怎么办？|按原始规格表重算，核对单位换算和四舍五入，再同时检查德语文案、图片与后台属性。运营确认后才提交该站点。
042|新品生命周期管理链路|新品登记→基础刊登→标识匹配→站点合规→测试发货→正式发货→物流回写|SKU、ASIN、FNSKU 分别在哪个环节用？|SKU 用于卖家内的库存和操作管理，ASIN 用于平台商品目录，FNSKU 是适用 FBA 场景下的配送库存标识。资料表要保留三者对应及适用站点，避免用错标签。|测试发货到批量发货之间要验证什么？|验证刊登、适用合规材料、标签、装箱与收货状态，再确认目标站点扩展与正式货量。飞书、ERP 或物流台账持续回写节点。|某站点刊登成功，但适用的产品安全资料仍待确认，能同时发货吗？|按目标站点实际要求复核资料缺口并标记受影响的 SKU。对该站点暂停需要合规放行的后续动作，由负责人确认后恢复。
043|关键词调研与词库搭建链路|确定核心词→前台调研→VOC 拓词→验证→生成词库|从哪里找到可核验的关键词？|用商品名称和关键属性做种子，从前台搜索、竞品标题、相关评论和可用报表找表达。记录来源、站点、日期和词义，再验证与实际商品是否相关。|一份可执行的词库怎样分层？|按品类、属性、场景、长尾、品牌或排除词分组，记录优先级和用途。列表可供标题、五点、后台字段及广告共用，同时保留站点规则复核。|第三方工具给某词很高的搜索量，但搜出来都是另一类商品，怎么处理？|以相关性和真实搜索意图为先，把它标为观察或排除。回查数据源与站点口径，避免高流量词引来不匹配访客。
044|亚马逊广告四阶段诊断链路|调研竞争环境→重建关键词矩阵→诊断页面→分析广告数据→优化|广告诊断为什么要从竞争和页面开始？|出价只影响部分流量。竞争价格、商品相关性、展示效果、商品可售状态都会影响表现。先把现有活动和核心关键词对应到商品，再看页面是否回答买家需求。|诊断清单怎么指导调整？|先区分曝光不足、点击弱、点击后转化差和获客过贵。给每类问题列证据、拟调整项、观察期和回退条件，并标注归因成熟程度。|核心词点击很多但订单少，而且前台价格明显偏高，应先改出价吗？|核对词意图、库存和价格带，评估页面与报价能否承接流量。先把最可能的转化问题验证清楚，再按目标成本调价或调整投放。
045|亚马逊市场调研六步链路|提取货源信息→分析前台竞品→挖掘 VOC→拆解对标→验证→调研报告|拿到一个 1688 链接，怎样判断是否值得做美国站？|提取真实商品规格、采购价和条款，再比较美国站同场景竞品的价格、评价、规格及配送。用用户痛点、实际费用和风险评估差异，记录调研日期。|市场报告最终要支持什么决定？|给出进入、补证观察或放弃的理由，附参考 ASIN、实际前台价格、成本假设和待核验数据。将可验证卖点交词库、采购和合规复核。|第三方估算需求很高，前台只找到少量相关竞品，怎么写结论？|先核对关键词、类目和目标人群是否一致。报告分别呈现来源、时间和分歧，列补证动作，在市场容量不明时避免作确定承诺。
046|新品上架后跟进链路|当日确认→早期抑制巡查→跟进购物车与评价→分析搜索词→调整投放→复盘|上线后的前几天优先检查什么？|逐个确认 ASIN 及变体可售，检查价格、库存、配送、内容和搜索抑制状态。根据广告资格、预算和实际可售情况决定投放，符合条件时再评估官方评价计划。|经营数据如何回到上架前的决策？|搜索词和转化回到词库与页面，退货原因回到内容、包装或产品，库存与补货回到供应链。复盘记录指标、行动和负责人。|上线三天花费较高但转化很少，要直接推翻所有策略吗？|先检查可售状态和流量相关性，再结合历史基线、样本量与归因周期判断。处理明确异常，给需要观察的指标设复查日期。
047|Google 与 WhatsApp 外贸拓客链路|定义买家画像→查公开商务入口→验证公司→合规联系与跟进|一个搜索结果怎样变成有用的 B2B 线索？|先按地区、品类和公司角色筛选，再对照企业官网确认业务匹配和公开商务联系方式。记录证据与来源，使用公司明确开放的业务联系渠道。|团队怎样接手这批线索？|在线索表记录公司、市场、需求证据、合规联系依据、负责人和状态。触达要有明确业务相关性，遵守当地规则、渠道政策与拒收要求。|搜索到一个号码，但找不到企业官网出处，怎么办？|保留企业名称和待核验理由，换用官方业务联系页面等明确入口。无法核实归属和联系依据时不发起联系。
048|LinkedIn 外贸外联链路|定义目标公司→识别相关岗位→核验业务线索→合规触达→记录结果|找到可能的决策者时，先核对什么？|核对公司是否在目标市场、岗位是否对应采购或合作职能、资料是否仍有效。优先使用企业官方渠道与公开商务信息，按平台规则接触。|谁来决定继续跟进或停止？|由线索负责人根据对方回复、业务相关性和已授权的渠道判断。把拒收及时登记，避免其他成员重复联系。|职位看起来匹配，但对方已经离开那家公司，怎么办？|更新公司与岗位状态，回到该公司的官方合作入口或现任岗位重新核验。保留失效理由用于减少重复调研。
049|Reddit VOC 调研五步链路|找社区→筛选帖子→拆解原话→映射业务动作→验证定位|Reddit 上的讨论适合回答什么问题？|适合发现购买前顾虑、使用场景、替代方案和用户实际用词。选相关社区与时间窗口，记录帖子背景和观点分歧。|怎样从帖子形成 Listing 或广告建议？|把观察整理成“场景、痛点、原话、可验证动作”，再和商品评价、搜索词及实际规格交叉验证。将证据强弱标进洞察表。|一个高赞帖子强烈反对某类材料，能代表全部消费者吗？|把意见当作该社区的信号，核对其他社区、评论和地区样本。确定确有目标人群需求后，再调整材料或表达。
050|跨境市场扩张七步流程|收集经营信息→确认约束→评分→就绪评估→市场深钻→路线图→KPI|评估新市场，先问自己还是先问市场？|两边都要。盘点现有产品、现金、人力、合规和履约能力，同时看目标市场需求、竞争、成本与支付习惯。记录评分权重与关键假设。|目标市场排名第一后怎么落计划？|完成优先市场深度验证，拆成合规准备、软启动、正式放量及复盘，定义资金、负责人、量化判断指标和暂停条件。|预估需求最大，但本地退货成本还没测，是否立即铺全目录？|先补成本和履约数据，选择少量有代表性的 SKU 测试，观察真实毛利和退货表现后再扩大目录。
051|独立站 CRO 审计六步链路|埋点检查→审计高影响页面→定位漏斗流失→验证原因→排序→修复|转化优化从主页改版开始吗？|从数据可信度和漏斗开始。检查商品页、加购、结账、支付各步及设备差异，找到损失集中的节点。用授权的聚合数据或遮蔽敏感信息的会话证据验证。|如何决定先修哪一个问题？|结合影响范围、证据强度、实施成本和可回退性排序。给每项写清目标事件及验证窗口，先处理确定的高影响故障。|移动端加购正常，支付转化骤降，先查什么？|核对移动端支付失败、配送费用提示、支付方式与地区限制，确认埋点准确，再用测试订单重现。
052|自动广告关键词收割周流程|拉搜索词报告→筛选成熟词→迁移手动精确→管理重叠→调价与库存检查|从自动广告“收割”的是什么？|用买家真实搜索词筛出相关、已积累转化且成本可接受的候选，给适用词建立手动精确投放。保留历史证据与迁移日期。|什么时候考虑在自动活动中加否定？|手动活动具备审核通过的配置、足够预算且已开始承接时，再评估是否需要否定以减少重叠。结合适用归因窗口、库存和活动边界复查。|一个词刚出一单，但结果还未归因完整，能马上迁移并否定吗？|先确认相关性、样本与可售库存，把它记为候选。等观察窗口和成本证据满足内部标准，再执行迁移，并验证手动活动承接。
053|到货收货差异处理流程|箱单对采购单→分类差异→取证处置→更新库存和账单|仓库收货时，采购单与箱单分别代表什么？|采购单记录预期订货规格和数量，箱单记录供应商声明的装箱情况。实收是第三个事实，逐行核对 SKU、数量及外包装。|发现短装、损坏或错发时怎么交接？|记录差异类型、受影响数量、照片及签收证据。仓库按状态入库或隔离，采购跟进补发、索赔或退回，财务按确认结果更新应付。|订 100 件，实收 100 件但 5 件破损，库存怎样更新？|记录实收 100、可用 95、隔离 5，按流程取证并联系供应商。待处置确认后同步调整库存与应付。
054|价格实验生命周期|假设与主指标→设计参数→上线实验→评估→落地|为什么价格实验可以看每访客收入？|价格变化同时影响客单价和转化，每访客收入把两者放到同一流量口径。还应预设利润、退货和用户体验等限制指标。|怎样设计一场可判断的测试？|预先定主指标、分流方式、最小样本、观察期和停止规则。检查随机分组和配置是否正确，复核不确定性和实际利润后再落地。|高价组前两天收入领先，能提前宣布胜出吗？|先检查样本和分流是否达到预设条件，保留完整观察期，再结合波动区间和利润判断。出现预定义风险时按停止规则处理。
055|指标异动根因排查链|触发告警→分渠道→拆订单量与客单价→区分流量和转化→定位 SKU|销售额突然下跌，如何逐层定位？|先验证数据是否延迟，再按站点和渠道拆贡献。用订单量和客单价分解收入，接着拆访客和转化，筛出影响最大的 SKU 与时间段。|根因排查要交付什么？|给出异常幅度、主要贡献对象、证据或待验证假设、处理动作和负责人。记录修复后指标回归情况以验证判断。|收入下降而订单数没变，优先排查广告流量吗？|先看客单价、商品组合、促销和退款如何变化，再决定是否下钻至流量渠道。把收入降幅按 SKU 分解。
056|Google Ads 智能出价爬坡计划|校验转化信号→观察学习→设初始目标→分步调整→检查新客价值→周度监控|调整目标 ROAS 前先验证什么？|确认转化追踪、价值回传、币种和转化延迟可靠，并核对账户是否有足够有效数据支撑所选策略。以当前表现和实际利润设置初始目标。|目标如何逐步优化？|把每次调整、理由、幅度、预计观察期和恢复条件记入日志。给学习和归因留出时间，兼顾花费与有效转化量。|提高目标 ROAS 后花费和订单显著下降，如何判断？|先检查转化信号和归因延迟，再看流量是否因目标过紧而收缩。对照阶段目标与利润决定维持、分步放宽或回退。

058|订单状态机迁移链|待支付→确认备货→发货→妥投→售后或退回|为什么订单状态需要定义允许的迁移？|支付、库存、发货提醒和售后会由状态变化触发。先约定待支付、已确认、已发货、已妥投及售后的合法路径，并保留触发时间和审计记录。|同一个事件重复收到怎么办？|使用事件 ID 或业务唯一键检查是否处理过，同时校验订单当前状态。重复事件只记录已处理结果，避免重复扣库存或发通知。|支付成功回调晚到，订单已发货，应该改回已支付吗？|校验回调和过往状态记录，识别它是否为延迟或重复事件。保持当前合法状态，同步遗漏的支付附属信息时保留记录。

<script type="text/plain" id="quiz-data">
S0|黑色款与白色款共用父级，哪个编号用于分别跟踪库存？|各自的卖家 SKU|父级 ASIN|两个变体共用的报价编号|可售子款需要独立追踪库存、报价和出错记录。
S0|还没确认目标类目支持按颜色变体，应先做什么？|检查类目模板和允许的变体主题|先建父级，审核失败再拆|把颜色写在标题中并共用一个 SKU|变体关系由类目决定，先核规则可避免错误合并。

S0|该站点已有完全相同的品牌、型号和包装商品，接下来先做什么？|核实是否应匹配现有 ASIN 并添加自己的报价|用新内部 SKU 强制创建一个新 ASIN|选择同类畅销 ASIN 来复用详情页|内部 SKU 与平台目录是两套标识。商品确实一致时按平台路径匹配现有目录。

S1|美国站有放行记录，准备在英国站刊登，如何复用？|复用已核实的产品事实，再按英国站核对应要求和证据|直接复制美国站的全部审批字段|先上传英国站，缺证时用美国截图解释|各站点有自己的要求，资料复用时要重新核对适用范围。

function normalizeAnswer(value) {

function mentionsPoint(text,aliases) {
  const negated = /(?:不需要|无需|不用|不必|不要|不查|别查|不做|忽略|跳过|不必核对|不检查|不核对|无需检查|不用管)$/u;
  return aliases.some(alias => {
    const needle = normalizeAnswer(alias);
    let from = 0;
    while (from < text.length) {
      const at = text.indexOf(needle,from);
      if (at < 0) return false;
      if (!negated.test(text.slice(Math.max(0,at-8),at))) return true;

  });

  nextBatch.disabled = !batch.more || !complete;
  nextBatch.textContent = !batch.more && complete ? "本环节题库已答完" : "换一批";
  byId("batch-progress").textContent = "第 " + (batch.second?2:1) + " / " + batch.total +
    " 批 · 已提交 " + (size-pending) + " / " + size +
    (batch.more && !complete ? " · 本批答完后解锁" : "");
  byId("previous").textContent = index === 0 && learningOrder[0] !== current ? "上一课" : "上一题";
  const atEnd = index === batch.end-1;
  let nextLabel = "下一题";
  if (atEnd && pending) nextLabel = "回到未答题";
  else if (atEnd && batch.more) nextLabel = "换一批";
  else if (atEnd && lastCard && !lastCourse) nextLabel = "下一课";
  else if (atEnd && current.id === "START" && !lastCard) nextLabel = index === 39 ? "综合实战" : "下一环节";
  const next = byId("next");
  next.textContent = nextLabel;
  next.disabled = complete && lastCard && lastCourse;
  byId("previous").disabled = index === 0 && current === learningOrder[0];
  byId("position").textContent = "本批 " + (index-batch.start+1) + " / " + size + " 题 · 全课 " +
    (index+1) + " / " + current.cards.length;
}
function renderCard(){
  const card = current.cards[index];
  const practice = card.practice;
  const status = statusFor(current.id,index);
  byId("card-kind").textContent = card.options ? "单选题" : practice ? "情景简答" : "简答题";
  byId("card-kind").classList.toggle("practice",Boolean(practice));
  byId("card-status").textContent = ({known:"已掌握",review:"待复习"})[status] || "未标记";
  const stage = learningLocation();
  byId("card-location").textContent = stage.buttonLabel || stage.title;
  if (current.id === "START") {
    Array.from(byId("flow").children).forEach((step,stepIndex) => {
      step.setAttribute("aria-current",stepIndex === card.phase ? "step" : "false");
    });
  }
  byId("question").textContent = card.q;
  renderAnswer(card);
  byId("mark-known").setAttribute("aria-pressed",String(status === "known"));
  byId("mark-review").setAttribute("aria-pressed",String(status === "review"));
  renderBatch();
}
function renderCourse(){
  byId("course-meta").textContent = current.id === "START" ? "入门综合课" : current.theme + " · CHAIN-CB-" + current.id;
  byId("course-title").textContent = current.title;
  const steps = current.id === "START" ? [...current.steps,"综合实战"] : current.steps;
  byId("flow").replaceChildren(...steps.map((step,i) => {
    const item = make("li","");
    if (i) {
      const arrow = make("b","›");
      arrow.setAttribute("aria-hidden","true");
      item.append(arrow);
    }
    if (current.id === "START") {
      const button = make("button",step);
      button.type = "button";
      button.className = "flow-button";
      button.addEventListener("click",() => {
        const start = i*5;
        const end = Math.min(start+5,current.cards.length);
        const pending = current.cards.slice(start,end).findIndex((_,offset) => !attempts[cardKey(current.id,start+offset)]);
        showQuestion(pending === -1 ? start : start+pending);
      });
      item.append(button);
    } else item.append(make("span",step));
    return item;
  }));
  const ids = current.id === "START" ? introSources : ["CHAIN-CB-" + current.id];
  byId("sources").replaceChildren(make("span","知识库原卡 · 草稿"),...ids.map(id => {
    const link = make("a",id);
    link.href = original + id + ".html";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.setAttribute("aria-label","打开本地知识库原卡 " + id);
    return link;
  }));
  renderMap();
  renderCard();
  renderDirectory();
}
function setCourse(course,cardNumber = startIndex(course)) {
  current = course;
  index = unlockedIndex(course,cardNumber);
  viewedStage = learningLocation();
  byId("map-courses").open = false;
  retrying = false;
  try { history.replaceState(null,"","#" + course.id); } catch { /* local file URL can be restricted */ }
  persist();
  renderCourse();
}
function showQuestion(cardNumber) {
  index = unlockedIndex(current,cardNumber);
  if (current.id === "START" && viewedStage !== learningLocation()) {
    viewedStage = learningLocation();
    byId("map-courses").open = false;
    renderMap();
  }
  retrying = false;
  persist();
  renderCard();
  byId("question").focus();
}
function swapBatch(){
  const batch = batchInfo(current,index);
  if (batch.more && batch.unanswered.length === 0) showQuestion(batch.end);
}
function move(direction) {
  const batch = batchInfo(current,index);
  if (direction > 0 && index === batch.end-1 && batch.unanswered.length) {
    showQuestion(batch.unanswered[0]);
    return;
  }
  const next = index + direction;
  if (next >= 0 && next < current.cards.length) {
    showQuestion(next);
  } else {
    const nextCourse = learningOrder[learningOrder.indexOf(current) + direction];
    if (nextCourse) setCourse(nextCourse,direction > 0 ? 0 : nextCourse.cards.length-1);
  }
  byId("question").focus();
}
function submitAnswer(event) {
  event.preventDefault();
  const card = current.cards[index];
  const input = card.options ? byId("quiz-options").querySelector("input:checked") : byId("answer-input");
  if (!input || !/[\p{L}\p{N}]/u.test(input.value.trim())) {
    byId("quiz-error").textContent = card.options ? "请先选择一个答案。" : "请先写下你的判断，再提交。";
    byId("quiz-error").hidden = false;
    if (!card.options) input.focus();
    return;
  }
  const response = card.options ? Number(input.value) : input.value.trim();
  const identifier = cardKey(current.id,index);
  const grade = gradeAnswer(card,response);
  attempts[identifier] = {response};
  if (card.options) marks[identifier] = grade.review ? "review" : "known";
  else if (grade.review) marks[identifier] = "review";
  retrying = false;
  refreshStudy();
  byId("grade-title").focus();
}
function refreshStudy(){
  persist();
  renderCard();
  renderDirectory();
  renderMapCourses();
  renderProgress();
}
function mark(value) {
  const markKey = cardKey(current.id,index);
  if (!attempts[markKey] || retrying) return;
  if (marks[markKey] === value) delete marks[markKey];
  else marks[markKey] = value;
  refreshStudy();
}

byId("course-title").tabIndex = -1;
byId("question").tabIndex = -1;
byId("search").addEventListener("input",renderDirectory);
byId("theme").addEventListener("change",renderDirectory);
byId("review-only").addEventListener("change",renderDirectory);
byId("quiz-form").addEventListener("submit",submitAnswer);
byId("retry").addEventListener("click",() => {
  retrying = true;
  renderCard();
  const first = current.cards[index].options ? byId("quiz-options").querySelector("input") : byId("answer-input");
  first?.focus();
});
byId("next-batch").addEventListener("click",swapBatch);
byId("card-location").addEventListener("click",() => {
  const stage = learningLocation();
  viewedStage = stage;
  renderMap();
  mapButtons.get(stage.id).focus();
});
byId("mark-review").addEventListener("click",() => mark("review"));
byId("mark-known").addEventListener("click",() => mark("known"));
byId("previous").addEventListener("click",() => move(-1));
byId("next").addEventListener("click",() => move(1));
window.addEventListener("hashchange",() => {
  const requested = catalog.get(location.hash.slice(1));
  if (requested && requested !== current) setCourse(requested);
});
if (matchMedia("(max-width:640px)").matches) byId("directory").open = false;
if (!storageAvailable) byId("storage-note").textContent = "这个浏览器当前无法加载学习记录，本次打开期间仍可标记卡片。";
byId("catalog-summary").textContent = (courses.length - 1) + " 条业务链路 · " + totalCards + " 道练习题";
renderCourse();
renderProgress();
</script>
</body>
</html>
